<style>

<script>

const BUILD="2026-09-08 · b9";
const $=id=>document.getElementById(id);
const fmt=n=>n==null||isNaN(n)?"—":Math.round(n).toLocaleString("vi-VN");
const vnd=n=>{if(n==null||isNaN(n))return "—";const k=n/1000;
 return (Math.abs(k)<10? k.toFixed(1).replace(".",",") : Math.round(k).toLocaleString("vi-VN"))+" ng";};
const pct=(n,d=1)=>n==null||!isFinite(n)?"—":(n*100).toFixed(d).replace(".",",")+"%";
const dec=(n,d=1)=>n==null||!isFinite(n)?"—":(+n).toFixed(d).replace(".",",");
const shift=(iso,d)=>{const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10)};

$("send").onclick=async()=>{
  const email=$("email").value.trim();
  if(!email){$("msg").className="msg err";$("msg").textContent="Chưa nhập email.";return}
  $("send").disabled=true;$("send").textContent="Đang gửi…";
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("#")[0]}});

$("email").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});

function chay(){
  Promise.resolve().then(render).catch(e=>{
    $("body").innerHTML='<div class="card" style="border-color:#7f1d1d"><h2>App gặp lỗi</h2>'
     +'<p class="sub">Trang dừng giữa chừng. Bản dựng '+BUILD+'. Chụp khối dưới gửi cho tôi là đủ để sửa.</p>'
     +'<pre style="white-space:pre-wrap;font-size:12px;background:var(--sunk);padding:12px;border-radius:10px;overflow:auto">'
     +String((e&&e.stack)||e).replace(/</g,"&lt;")+'</pre></div>';
  });
}
$("period").onchange=chay;
$("camp").onchange=chay;
$("lai").onclick=()=>{ buocLai=true; chay(); };

function spark(series){
  if(!series.length) return '<div class="note">Không có dữ liệu trong khoảng này</div>';
  const w=560,h=62,p=3,max=Math.max(...series.map(x=>x.v),1);
  const X=i=>p+i*(w-2*p)/Math.max(series.length-1,1), Y=v=>h-p-(v/max)*(h-2*p-8);
  const pts=series.map((x,i)=>X(i).toFixed(1)+","+Y(x.v).toFixed(1)).join(" ");
  const last=series[series.length-1];
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Xu hướng theo ngày">'
   +'<polygon points="'+p+','+(h-p)+' '+pts+' '+X(series.length-1).toFixed(1)+','+(h-p)+'" fill="var(--accent)" opacity=".13"></polygon>'
   +'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>'
   +'<circle cx="'+X(series.length-1).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="3.4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"></circle></svg>'
   +'<div class="note" style="border:0;padding:0;margin-top:7px;display:flex;justify-content:space-between">'
   +'<span>'+series[0].d.slice(8)+"/"+series[0].d.slice(5,7)+'</span><span>đỉnh <b class="mono">'+fmt(max)+'</b> · gần nhất <b class="mono">'+fmt(last.v)+'</b></span></div>';
}
function delta(cur,prev,goodUp=true){
  if(prev==null||prev===0) return '<div class="d">kỳ trước —</div>';
  const r=(cur-prev)/Math.abs(prev);
  const cls=Math.abs(r)<0.02?"flat":(r>0)===goodUp?"up":"down";
  const a=Math.abs(r)<0.02?"→":r>0?"↑":"↓";
  return '<div class="d"><span class="'+cls+'">'+a+" "+(Math.abs(r)*100).toFixed(0)+'%</span> <span style="opacity:.7">vs '+fmt(prev)+"</span></div>";
}
const kpi=(l,v,d,h)=>'<div class="kpi"><div class="l">'+l+'</div><div class="v mono">'+v+"</div>"+(d||"")
 +(h?'<div class="hint">'+h+"</div>":"")+"</div>";

let KHO=null, buocLai=false;   // kho tam trong bo nho: doi campus/thoi gian khong goi lai 25 truy van
const TEN_NGUON=["ga4_daily_channel","gsc_daily","gsc_query","meta_ad_daily","meta_campaign_daily",
  "gsc_page","v_web_su_kien","v_web_trang","web_click","v_siso","v_lead_campus","v_diem_danh",
  "v_siso (1 dòng)","v_web_tong","v_tuan_campus","chi_tieu","v_can_ly_do","v_cohort_tuan",
  "v_viec_tuan","v_danh_sach","v_su_co","v_nghi_chuoi","v_harasocial","v_nguoi","v_supa"];
const LOC_CAMPUS=[18,19];   // hai truy van duy nhat loc theo campus o phia may chu
function taoTruyVan(CP){ return [
    sb.from("ga4_daily_channel").select("day,channel,sessions,active_users").order("day",{ascending:false}).limit(1600),
    sb.from("gsc_daily").select("day,clicks,impressions,ctr,position").order("day",{ascending:false}).limit(400),
    sb.from("gsc_query").select("snapshot_on,query,clicks,impressions,ctr,position").order("snapshot_on",{ascending:false}).order("impressions",{ascending:false}).limit(1200),
    sb.from("meta_ad_daily").select("day,account_name,spend,impressions,reach,clicks").order("day",{ascending:false}).limit(1200),
    sb.from("meta_campaign_daily").select("day,account_name,campaign_name,objective,spend,impressions,reach,clicks,link_clicks,results,result_type").order("day",{ascending:false}).limit(2000),
    sb.from("gsc_page").select("snapshot_on,page,clicks,impressions,ctr,position").order("snapshot_on",{ascending:false}).order("clicks",{ascending:false}).limit(600),
    sb.from("v_web_su_kien").select("cua_so,event_name,so_lan,nguoi").limit(500),
    sb.from("v_web_trang").select("cua_so,landing_page,phien,gan_ket,giay_tong,su_kien").limit(500),
    sb.from("web_click").select("ts,kind,page,ref").order("ts",{ascending:false}).limit(4000),
    sb.from("v_siso").select("nhom,campus,so_hs,so_lop").limit(2000),
    sb.from("v_lead_campus").select("ngay,campus,giai_doan,nguon,so_lead").limit(2000),
    sb.from("v_diem_danh").select("ngay,campus,di_hoc,vang,dan_thuoc").order("ngay",{ascending:false}).limit(2000),
    sb.from("v_siso").select("nhom,campus,so_hs").limit(1),
    sb.from("v_web_tong").select("cua_so,su_kien,phien").limit(10),
    sb.from("v_tuan_campus").select("tuan,campus,cuoc_goi,lead_moi,hen,da_tham_quan,dat_coc,da_di_hoc").order("tuan",{ascending:false}).limit(2000),
    sb.from("chi_tieu").select("campus,thang,tuyen_moi,si_so_kh").limit(500),
    sb.from("v_can_ly_do").select("campus,ten,giai_doan,so_ngay_im_lang,ly_do,ngay_doi").order("so_ngay_im_lang",{ascending:false}).limit(1000),
    sb.from("v_cohort_tuan").select("tuan_tao,campus,lead,cham_24h,cham_2_lan_tro_len,chua_ai_cham,hen_tham,coc_chot,tu_choi,im_lang_14").limit(500),
    (CP? sb.from("v_viec_tuan").select("ro,campus,ten,giai_doan,kenh,ngay_tao,im_lang,so_cham").eq("campus",CP).not("ro","is",null).order("im_lang",{ascending:false}).limit(1000)
       : sb.from("v_viec_tuan").select("ro,campus,ten,giai_doan,kenh,ngay_tao,im_lang,so_cham").not("ro","is",null).order("im_lang",{ascending:false}).limit(1000)),
    (CP? sb.from("v_danh_sach").select("tang,campus,ten,kenh,giai_doan,ngay_tao,im_lang,so_cham,goi_nghe_may,goi_khong_nghe,cham_cuoi_ngay,cham_cuoi_ai,cham_cuoi_lam_gi,cham_cuoi_ket_qua,cham_cuoi_ghi_chu,dien_thoai").eq("campus",CP).order("im_lang",{ascending:false}).limit(1000)
       : sb.from("v_danh_sach").select("tang,campus,ten,kenh,giai_doan,ngay_tao,im_lang,so_cham,goi_nghe_may,goi_khong_nghe,cham_cuoi_ngay,cham_cuoi_ai,cham_cuoi_lam_gi,cham_cuoi_ket_qua,cham_cuoi_ghi_chu,dien_thoai").order("im_lang",{ascending:false}).limit(1000)),
    sb.from("v_su_co").select("ma_ticket,ngay_tao,campus,phan_loai,muc_do,trang_thai,tieu_de,nguoi_tao,nguoi_duoc_giao,so_ngay_mo,con_mo,he_trong,so_tre_lq").order("ngay_tao",{ascending:false}).limit(1000),
    sb.from("v_nghi_chuoi").select("ma_tre,ten_tre,lop,campus,tu_ngay,den_ngay,so_buoi,ly_do,dang_dien_ra,chua_quay_lai,ngay_ke_tu_khi_nghi").order("den_ngay",{ascending:false}).limit(1000),
    sb.from("v_harasocial").select("id,ngay,nguoi,trang,tra_loi_dau_giay,so_tin").limit(2000),
    sb.from("v_nguoi").select("campus,ten_vui,ten_that,nguon_ten,vai_tro").limit(50),
    sb.from("v_supa").select("campus,bo_ma,bo_ten,ngay,so_phieu,so_dat,so_chua_dat,ty_le_dat").order("ngay",{ascending:false}).limit(2000)
];}
// Ban 25 truy van cung luc lam Postgres tranh CPU voi chinh no -> view nang bi
// "canceling statement due to statement timeout". Chay theo lo nho, view nang di truoc.
const SONG_SONG=4;
const THU_TU=TEN_NGUON.map((t,i)=>i)
  .sort((a,b)=>(TEN_NGUON[b].indexOf("v_")===0?1:0)-(TEN_NGUON[a].indexOf("v_")===0?1:0));
const HET_GIO=/timeout|canceling statement/i;
const bocMot=async(CP,i)=>{
  const t=performance.now(); let r=null, thu=0;
  for(let lan=0;lan<2;lan++){
    thu++;
    try{ r=await taoTruyVan(CP)[i]; }
    catch(e){ r={data:null,error:{message:String(e&&e.message||e)}}; }
    if(!r||!r.error||!HET_GIO.test(r.error.message||"")) break;
    await new Promise(s=>setTimeout(s,700));     // het gio -> nghi mot nhip roi thu lai dung 1 lan
  }
  r=r||{data:null,error:{message:"không rõ"}};
  r.__ms=Math.round(performance.now()-t); r.__i=i; r.__thu=thu; return r;
};
async function chayTheoLo(CP, ds){
  const kq={}; let k=0;
  const tho=async()=>{ while(k<ds.length){ const i=ds[k++]; kq[i]=await bocMot(CP,i); } };
  await Promise.all(Array.from({length:Math.min(SONG_SONG,ds.length)},tho));
  return kq;
}
async function napKho(CP, ep){
  if(!ep && KHO){
    if(KHO.cp===CP) return KHO.kq;                     // khong doi gi -> dung lai het
    const m=await chayTheoLo(CP, LOC_CAMPUS);           // doi campus -> chi goi lai 2 truy van
    const kq=KHO.kq.slice(); LOC_CAMPUS.forEach(i=>{kq[i]=m[i];});
    KHO={t:KHO.t, tLoc:new Date(), cp:CP, kq:kq, tong:KHO.tong}; return kq;
  }
  const t0=performance.now();
  const m=await chayTheoLo(CP, THU_TU);
  const kq=TEN_NGUON.map((_,i)=>m[i]);
  KHO={t:new Date(), tLoc:new Date(), cp:CP, kq:kq, tong:Math.round(performance.now()-t0)};
  return kq;
}

async function render(){
  const n=+$("period").value;
  const CP=$("camp").value||"";            // "" = toan he thong
  const hopCP=(c)=>!CP||String(c||"")===CP; // dong nay co thuoc campus dang chon khong
  $("body").innerHTML='<div class="card"><p class="sub">Đang tải…</p></div>';
  const KQ = await napKho(CP, buocLai);
  buocLai=false;

   +'<p class="leg"><b>“Nghiêm trọng”</b> = phân loại An toàn hoặc Hành vi, hoặc mức độ Cao. Đây là quy ước của app, không phải của Tomia — Tomia chỉ ghi phân loại và mức độ rời nhau.</p>'
   +'<div class="q"><b>Nguyên tắc thứ nhất:</b> an toàn trẻ em không đứng sau tăng trưởng. '
   +'Một ticket mức Cao còn mở sau 48 giờ là một quyết định đã bị hoãn, không phải một việc đang chờ. '
   +'Dòng nào ghi <i>chưa giao</i> — ai là người nhận nó trước khi hết ngày hôm nay?</div></div>';

  // ----- THE: TRE NGHI LIEN TUC (Tomia, sheet diem danh chi tiet) -----
  const ngLoc=(nghi||[]).filter(r=>hopCP(r.campus));
  const ngDang=ngLoc.filter(r=>r.dang_dien_ra);
  const ngMat=ngLoc.filter(r=>r.chua_quay_lai&&!r.dang_dien_ra).sort((a,b)=>(+a.ngay_ke_tu_khi_nghi||0)-(+b.ngay_ke_tu_khi_nghi||0));
  const ngCoLyDo=ngLoc.filter(r=>r.ly_do&&String(r.ly_do).trim());
  const ngTheoCampus={}; ngLoc.forEach(r=>{const k=r.campus||"(chưa rõ)";
    const o=ngTheoCampus[k]||(ngTheoCampus[k]={n:0,dang:0,buoi:0,cly:0});
    o.n++; if(r.dang_dien_ra)o.dang++; o.buoi+=+r.so_buoi||0; if(r.ly_do)o.cly++});
  const ngCampusRows=Object.entries(ngTheoCampus).sort((a,b)=>b[1].dang-a[1].dang||b[1].n-a[1].n);
  const ngCard = !ngLoc.length ? "" :
   '<div class="card"><h2>Trẻ nghỉ liên tục từ 3 buổi</h2>'
   +'<p class="sub">Từ Tomia · điểm danh chi tiết từng trẻ · '+nhanCP+'</p>'
   +'<p class="leg" style="margin-top:-6px">⏱ Chuỗi nghỉ tính theo <b>ngày học liên tiếp</b> — đã bỏ thứ Bảy, Chủ nhật và ngày nghỉ lễ. Gọi hỏi thăm <b>từ buổi thứ tư</b>.</p>'
   +'<div class="kpis">'
   +kpi("Đang nghỉ dở",fmt(ngDang.length),"","chưa quay lại, mới nghỉ trong vòng 7 ngày")
   +kpi("Nghỉ lâu, chưa quay lại",fmt(ngMat.length),"","quá 7 ngày — nghi đã nghỉ hẳn")
   +kpi("Tổng chuỗi ≥3 buổi",fmt(ngLoc.length),"","toàn bộ dữ liệu điểm danh đã có")
   +kpi("Có ghi lý do",fmt(ngCoLyDo.length)+" / "+fmt(ngLoc.length),"","phần còn lại không ai biết vì sao")+"</div>"
   +(ngDang.length ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Đang nghỉ dở — gọi hôm nay</p>'
     +'<div class="tw"><table><thead><tr><th>Bé</th><th>Lớp</th><th>Campus</th><th>Nghỉ từ</th><th>Đến</th><th>Số buổi</th><th>Lý do</th></tr></thead><tbody>'
     +ngDang.sort((a,b)=>(+b.so_buoi||0)-(+a.so_buoi||0)).slice(0,25).map(r=>
       "<tr><td>"+(r.ten_tre||r.ma_tre||"—")+"</td><td>"+(r.lop||"—")+"</td><td>"+nhan(r.campus)
       +"</td><td>"+(r.tu_ngay||"—")+"</td><td>"+(r.den_ngay||"—")
       +'</td><td class="mono">'+((+r.so_buoi||0)>=4?'<span class="down">':"<span>")+fmt(r.so_buoi)+"</span>"
       +"</td><td>"+(r.ly_do||'<span style="opacity:.5">không ghi</span>')+"</td></tr>").join("")
     +"</tbody></table></div>" : "")
   +(ngMat.length ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Nghỉ lâu, chưa quay lại — đã ai gọi chưa?</p>'
     +'<div class="tw"><table><thead><tr><th>Bé</th><th>Lớp</th><th>Campus</th><th>Buổi vắng đầu</th><th>Số buổi</th><th>Đã bao lâu</th><th>Lý do</th></tr></thead><tbody>'
     +ngMat.slice(0,20).map(r=>
       "<tr><td>"+(r.ten_tre||r.ma_tre||"—")+"</td><td>"+(r.lop||"—")+"</td><td>"+nhan(r.campus)
       +"</td><td>"+(r.tu_ngay||"—")+'</td><td class="mono">'+fmt(r.so_buoi)
       +'</td><td class="mono"><span class="down">'+fmt(r.ngay_ke_tu_khi_nghi)+" ngày</span></td><td>"
       +(r.ly_do||'<span style="opacity:.5">không ghi</span>')+"</td></tr>").join("")
     +"</tbody></table></div>"
     +(ngMat.length>20?'<p class="leg">Hiện 20 ca gần nhất trong '+fmt(ngMat.length)+'.</p>':"") : "")
   +(ngCampusRows.length>1 ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Theo campus</p>'
     +'<div class="tw"><table><thead><tr><th>Campus</th><th>Đang nghỉ dở</th><th>Tổng chuỗi</th><th>Buổi nghỉ TB/chuỗi</th><th>Có ghi lý do</th></tr></thead><tbody>'
     +ngCampusRows.map(([k,v])=>"<tr><td>"+nhan(k)+'</td><td class="mono">'+(v.dang?'<span class="down">'+v.dang+"</span>":"0")
       +'</td><td class="mono">'+fmt(v.n)+'</td><td class="mono">'+(v.n?(v.buoi/v.n).toFixed(1):"—")
       +'</td><td class="mono">'+fmt(v.cly)+" / "+fmt(v.n)+"</td></tr>").join("")+"</tbody></table></div>" : "")
   +'<p class="leg"><b>“Chuỗi” là gì:</b> những <b>buổi học liền nhau</b> mà bé vắng. Cuối tuần và ngày nghỉ lễ không phải buổi học — không cắt chuỗi, cũng không cộng vào. '
   +'Nghỉ T6 rồi nghỉ tiếp T2 = <b>chuỗi 2 buổi</b>, không phải 4.<br>'
   +'<b>“Đang nghỉ dở”</b> = sau chuỗi đó bé <b>chưa có buổi đi học nào</b>, và buổi vắng cuối cách ngày học gần nhất của campus <b>không quá 7 ngày</b>. Đây là danh sách gọi hôm nay.<br>'
   +'<b>“Nghỉ lâu, chưa quay lại”</b> = cũng chưa đi học lại, nhưng đã quá 7 ngày. Một cuộc gọi không cứu được nữa — nhưng vẫn cần gọi để biết <b>vì sao</b>.</p>'
   +'<div class="q"><b>Câu hỏi:</b> trong danh sách “đang nghỉ dở” ở trên, bé nào đã có người gọi cho phụ huynh? '
   +'Nếu chưa có ai gọi và cũng không ai ghi lý do — thì ME School đang không biết bé đó ốm, đi du lịch, hay đã quyết định nghỉ.</div></div>';

  // ----- THE: MESSENGER / ZALO (Harasocial) -----
  const hrLoc=(hara||[]);
  const hrNguoi={}; hrLoc.forEach(r=>{const k=r.nguoi||"(không rõ)";
    const o=hrNguoi[k]||(hrNguoi[k]={n:0,tin:0,tl:[]}); o.n++; o.tin+=+r.so_tin||0;

  const trungVi=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y);return b[Math.floor((b.length-1)/2)]};
  const hrTLall=hrLoc.map(r=>+r.tra_loi_dau_giay||0).filter(x=>x>0);
  const hrTV=trungVi(hrTLall);
  const hrKhongTL=hrLoc.filter(r=>!(+r.tra_loi_dau_giay>0)).length;
  const hrNgay=[...new Set(hrLoc.map(r=>r.ngay))].sort();
  const phut=g=>g==null?"—":(g<3600?Math.round(g/60)+" phút":(g/3600).toFixed(1)+" giờ");
  const hrCard = !hrLoc.length ? "" :
   '<div class="card"><h2>Messenger &amp; Zalo</h2>'
   +'<p class="sub">Từ Harasocial · phiên hội thoại trên các trang Facebook của ME School</p>'
   +'<p class="leg" style="margin-top:-6px">⏱ Harasocial chỉ giữ khoảng <b>7 ngày gần nhất</b> và bỏ qua bộ lọc ngày — '
   +'dữ liệu hiện có: <b>'+(hrNgay[0]||"—")+' → '+(hrNgay[hrNgay.length-1]||"—")+'</b>. Tuần nào không bấm dấu trang là mất vĩnh viễn tuần đó.</p>'
   +'<div class="kpis">'
   +kpi("Phiên hội thoại",fmt(hrLoc.length),"","trong cửa sổ Harasocial trả về")
   +kpi("Người xử lý",fmt(Object.keys(hrNguoi).length),"","kể cả trợ lý AI")
   +kpi("Trả lời lần đầu",phut(hrTV),"","trung vị — không phải trung bình")
   +kpi("Không ai trả lời",fmt(hrKhongTL),"","phiên không có phản hồi nào")+"</div>"
   +'<div class="tw" style="margin-top:14px"><table><thead><tr><th>Người xử lý</th><th>Phiên</th><th>Tin đã gửi</th><th>Trả lời lần đầu (trung vị)</th></tr></thead><tbody>'
   +Object.entries(hrNguoi).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>
     "<tr><td>"+k+'</td><td class="mono">'+fmt(v.n)+'</td><td class="mono">'+fmt(v.tin)
     +'</td><td class="mono">'+phut(trungVi(v.tl))+"</td></tr>").join("")
   +"</tbody></table></div>"
   +'<div class="gap"><b>Không có campus nào trong bảng này.</b> Toàn bộ tin nhắn của các trang Facebook đang do một người tiếp nhận, '
   +'sau đó mới chuyển về campus. Nghĩa là năng lực phản hồi mạng xã hội của ME School bằng đúng năng lực của một người.</div>'
   +'<div class="q"><b>Câu hỏi:</b> tuần Hiền nghỉ phép thì ai trả lời? Và ai biết được điều đó đã xảy ra — '
   +'ngoài việc thấy lead tuần ấy tự nhiên ít đi?</div></div>';

  // ----- THE: CHECKLIST SUPA -----
  const spTatCa=(supa||[]).filter(r=>hopCP(r.campus));
  const spMax=spTatCa.reduce((a,r)=>r.ngay>a?r.ngay:a,"");
  const spT0=spMax?new Date(String(spMax).slice(0,10)+"T00:00:00Z").getTime():NaN;
  const spMoc=isNaN(spT0)?"":new Date(spT0-27*864e5).toISOString().slice(0,10);
  const spLoc=spTatCa.filter(r=>r.ngay>=spMoc);   // 4 tuan gan nhat
  const spNgay=[...new Set(spLoc.map(r=>r.ngay))].sort();
  const spBo={}; spLoc.forEach(r=>{const k=r.bo_ma;
    const o=spBo[k]||(spBo[k]={ten:r.bo_ten||k,ph:0,dat:0,chua:0});
    o.ph+=+r.so_phieu||0; o.dat+=+r.so_dat||0; o.chua+=+r.so_chua_dat||0; if(r.bo_ten)o.ten=r.bo_ten});
  const spCam={}; spLoc.forEach(r=>{const k=r.campus||"(chưa rõ)";
    const o=spCam[k]||(spCam[k]={ph:0,dat:0,chua:0,cuoi:""});
    o.ph+=+r.so_phieu||0; o.dat+=+r.so_dat||0; o.chua+=+r.so_chua_dat||0;
    if(r.ngay>o.cuoi)o.cuoi=r.ngay});
  const spCamRows=Object.entries(spCam).sort((a,b)=>{
    const ta=a[1].dat+a[1].chua?a[1].dat/(a[1].dat+a[1].chua):1;
    const tb=b[1].dat+b[1].chua?b[1].dat/(b[1].dat+b[1].chua):1; return ta-tb});
  const spTongPh=spLoc.reduce((a,r)=>a+(+r.so_phieu||0),0);
  const spTongDat=spLoc.reduce((a,r)=>a+(+r.so_dat||0),0);
  const spTongChua=spLoc.reduce((a,r)=>a+(+r.so_chua_dat||0),0);
  const spTL=(spTongDat+spTongChua)?100*spTongDat/(spTongDat+spTongChua):null;
  const spCard = !spLoc.length ? "" :
   '<div class="card"><h2>Checklist SUPA</h2>'
   +'<p class="sub">Từ SUPA · '+nhanCP+' · '+(spNgay[0]||"—")+' → '+(spNgay[spNgay.length-1]||"—")+'</p>'
   +'<p class="leg" style="margin-top:-6px">⏱ <b>4 tuần gần nhất</b> (kho có từ '+((spTatCa[0]&&spTatCa.reduce((a,r)=>r.ngay<a?r.ngay:a,"9999"))||"—")+'), <b>không đổi theo ô chọn thời gian</b>. '
   +'Câu trả lời “N/A” không tính vào tỷ lệ — chỉ đếm câu <b>đạt</b> và <b>chưa đạt</b>.</p>'
   +'<div class="kpis">'
   +kpi("Lần đi kiểm",fmt(spTongPh),"","mỗi lần là một phiếu, gồm nhiều câu")
   +kpi("Câu đã trả lời",fmt(spTongDat+spTongChua),"",(spTongPh?dec((spTongDat+spTongChua)/spTongPh,1):"—")+" câu mỗi lần kiểm")
   +kpi("Câu chưa đạt",fmt(spTongChua),"","việc thật sự cần sửa")
   +kpi("Tỷ lệ đạt",dec(spTL,1)+"%","","câu đạt ÷ câu đã trả lời")+"</div>"
   +'<div class="tw" style="margin-top:14px"><table><thead><tr><th>Bộ checklist</th><th>Lần kiểm</th><th>Câu đã trả lời</th><th>Câu chưa đạt</th><th>Tỷ lệ đạt</th></tr></thead><tbody>'
   +Object.entries(spBo).sort((a,b)=>b[1].ph-a[1].ph).map(([k,v])=>{
     const tl=(v.dat+v.chua)?100*v.dat/(v.dat+v.chua):null;
     return "<tr><td>"+v.ten+'</td><td class="mono">'+fmt(v.ph)+'</td><td class="mono">'+fmt(v.dat+v.chua)
       +'</td><td class="mono">'+(v.chua?'<span class="down">'+fmt(v.chua)+"</span>":"0")
       +'</td><td class="mono">'+dec(tl,1)+"%</td></tr>"}).join("")
   +"</tbody></table></div>"
   +(spCamRows.length>1 ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Theo campus — thấp nhất trước</p>'
     +'<div class="tw"><table><thead><tr><th>Campus</th><th>Lần kiểm</th><th>Câu chưa đạt / tổng câu</th><th>Tỷ lệ đạt</th><th>Kiểm gần nhất</th></tr></thead><tbody>'
     +spCamRows.map(([k,v])=>{const tl=(v.dat+v.chua)?100*v.dat/(v.dat+v.chua):null;
       return "<tr><td>"+nhan(k)+'</td><td class="mono">'+fmt(v.ph)+'</td><td class="mono">'+fmt(v.chua)+" / "+fmt(v.dat+v.chua)
       +'</td><td class="mono">'+(tl!==null&&tl<85?'<span class="down">':"<span>")+dec(tl,1)+"%</span></td><td>"+(v.cuoi||"—")+"</td></tr>"}).join("")
     +"</tbody></table></div>" : "")
   +'<p class="leg"><b>Hai đơn vị khác nhau, đừng so trực tiếp:</b> <b>lần kiểm</b> là một lượt người đi kiểm; '
   +'<b>câu</b> là từng dòng trong checklist đó. Một lần kiểm chứa khoảng 7–10 câu, nên số câu chưa đạt hoàn toàn có thể lớn hơn số lần kiểm.<br>'
   +'Ví dụ Thảo Điền, checklist an toàn lớp học: <b>48 lần kiểm</b> → <b>324 câu</b> → <b>48 câu chưa đạt</b>. Hai số 48 bằng nhau là trùng hợp, không liên quan.</p>'
   +'<p class="leg"><b>Cách đọc:</b> tỷ lệ đạt cao không có nghĩa là an toàn — nó có nghĩa là <b>người đi kiểm đã trả lời “đã hoàn thành”</b>. '
   +'Đối chiếu campus có tỷ lệ đạt cao nhưng vẫn có ticket sự cố ở thẻ trên: đó là chỗ checklist đang không nhìn thấy thứ cần nhìn.</p>'
   +'<div class="q"><b>Câu hỏi:</b> campus nào lâu nhất chưa có lần kiểm nào? Và trong số câu “chưa đạt”, câu nào lặp lại nhiều lần — '
   +'vì một câu trượt liên tục không phải lỗi người làm, mà là lỗi thiết kế quy trình.</div></div>';

  // ----- THE: VIEC CUA TUAN NAY (danh sach hanh dong) -----
  const RO=["Chưa ai chạm","Đã thăm chưa chốt","Hẹn rồi, chưa thấy kết quả","Im lặng trên 14 ngày"];
  const LUAT={"Chưa ai chạm":"Chạm lần đầu trong 24h. Nếu khách chỉ nhắn tin, nhắn — đừng gọi.",
    "Đã thăm chưa chốt":"Gọi trong 48h sau visit. Hỏi đúng một câu: điều gì khiến anh/chị chưa quyết?",
    "Hẹn rồi, chưa thấy kết quả":"Xác nhận lại lịch, hoặc hỏi vì sao không đến được. Ghi lại câu trả lời.",
    "Im lặng trên 14 ngày":"Một lần chạm cuối. Rồi đóng KÈM LÝ DO — kể cả lý do “không phù hợp”."};
  const vLoc=(viec||[]).filter(r=>hopCP(r.campus));
  const vRo={}; vLoc.forEach(r=>{(vRo[r.ro]=vRo[r.ro]||[]).push(r)});
  // ba ro dau la de CUU -> moi nhat truoc; ro "im lang" la de DONG -> lau nhat truoc
  Object.keys(vRo).forEach(k=>{ if(k!=="Im lặng trên 14 ngày") vRo[k].sort((a,b)=>(+a.im_lang||0)-(+b.im_lang||0)); });
  const viecCard = !vLoc.length ? "" :
   '<div class="card"><h2>Việc của tuần này</h2><p class="sub">'+nhanCP+' · '+fmt(vLoc.length)+' hồ sơ đang chờ một hành động cụ thể</p>'
   +'<p class="leg" style="margin-top:-6px">⏱ Danh sách này tính trên <b>90 ngày gần nhất</b>, không đổi theo ô chọn thời gian.</p>'
   +'<div class="kpis">'
   +RO.map(k=>kpi(k,fmt((vRo[k]||[]).length),"",
       (vRo[k]&&vRo[k].length)?("im lặng TB "+Math.round(vRo[k].reduce((s2,r)=>s2+(+r.im_lang||0),0)/vRo[k].length)+" ngày"):"không có ai")).join("")
   +"</div>"
   +RO.filter(k=>vRo[k]&&vRo[k].length).map(k=>{
     const rows=vRo[k].slice(0,8);
     return '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">'+k+' — '+fmt(vRo[k].length)+' hồ sơ</p>'
       +'<div class="q" style="margin:0 0 8px">'+LUAT[k]+'</div>'
       +'<div class="tw"><table><thead><tr><th>Phụ huynh / bé</th><th>Số điện thoại</th><th>Campus</th><th>Kênh</th><th>Lần chạm</th><th>Im lặng</th></tr></thead><tbody>'
       +rows.map(r=>"<tr><td>"+(r.ten||"(không tên)")+"</td><td>"+sdt(r.dien_thoai)+"</td><td>"+r.campus+"</td><td>"+(r.kenh||"—")
         +'</td><td class="mono">'+fmt(r.so_cham)+'</td><td class="mono">'+fmt(r.im_lang)+" ngày</td></tr>").join("")
       +"</tbody></table></div>"
       +(vRo[k].length>8?'<p class="leg">Hiện 8 hồ sơ '+(k==="Im lặng trên 14 ngày"?"im lặng lâu nhất":"mới nhất")+' trong '+fmt(vRo[k].length)+'. Lọc theo campus để thấy phần của mình.</p>':"")}).join("")

     +'<div class="tw"><table><thead><tr><th>Giai đoạn</th><th>Số lead</th></tr></thead><tbody>'
     +gdRows.map(([k,v])=>"<tr><td>"+k+'</td><td class="mono">'+fmt(v)+"</td></tr>").join("")+"</tbody></table></div>" : "")
   +'<p class="leg"><b>Cách phân loại:</b> trường “Lớp” trong AMIS chứa cả lớp thật lẫn trạng thái. '
   +'Thứ tự ưu tiên: đã rời (Nghỉ học/Tốt nghiệp/Hoàn cọc) → Bảo lưu → Chờ nhập học → Ngắn ngày → lớp thật (TTLN/Ghi nhận/GTTC). '
   +'Một học sinh có thể mang nhiều giá trị cùng lúc, nên thứ tự này quyết định họ được đếm vào đâu.</p>'
   +(chuaPL ? '<div class="gap"><b>'+fmt(chuaPL)+' học sinh chưa phân loại được</b> — bản ghi không có giá trị ở trường Lớp.<br>'
     +'Ai điền trường này khi nhận học sinh mới?</div>' : "")
   +'<div class="gap"><b>Hai campus đang dùng số tạm.</b> Tân Thuận và Linh Đàm không dùng AMIS CRM (cấu trúc pháp lý riêng), '
   +'nên sĩ số của họ đang lấy từ điểm danh Tomia — xem chú thích dưới bảng. Khi nào hai campus này có sổ sĩ số thật, thay vào đây và bỏ chữ “tạm”.<br>'
   +'Đối chiếu: file nhân sự ghi <b>768 học sinh / 161 giáo viên</b>.</div>'
   +'<div class="q"><b>Câu hỏi:</b> con số “đang đi học” này có khớp với sổ điểm danh sáng nay ở từng campus không — lệch ở đâu?</div></div>';

  // ----- THE: BANG DIEM CAMPUS THEO NGAY -----
  // Don vi la NGAY HOC, khong phai tuan. Dai = 3 ngay CUNG THU truoc do (T3 nay vs 3 T3 truoc),
  // vi thu Hai va thu Sau khong giong nhau — so cheo thu la tu tao bao dong gia.
  const chiNgay=d=>{const m=String(d||"").match(/\d{4}-\d{2}-\d{2}/); return m?m[0]:null;};
  const luiNgay=(d,n)=>{const t=new Date(d+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()-n); return t.toISOString().slice(0,10);};
  const THU=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
  const tenThu=d=>THU[new Date(d+"T00:00:00Z").getUTCDay()];
  const bdD={}, bdBo=0, bdMau={};
  const oD=(c,d)=>{const a=bdD[c]||(bdD[c]={}); return a[d]||(a[d]={lead:0,dh:null,vang:null,ng:0,spc:0,spt:0,tk:0});};
  const ghiBo=(k,v)=>{ if(!bdMau[k]) bdMau[k]=String(v); };
  (tsi||[]).filter(r=>r.campus&&hopCP(r.campus)&&r.campus!=="TRUNG TÂM").forEach(r=>{
    const d=chiNgay(r.ngay); if(!d){ghiBo("lead",r.ngay);return;} oD(r.campus,d).lead+=+r.so_lead||0;});
  (dd||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.ngay); if(!d){ghiBo("diemdanh",r.ngay);return;}
    const o=oD(r.campus,d); o.dh=(o.dh||0)+(+r.di_hoc||0); o.vang=(o.vang||0)+(+r.vang||0);});
  (nghi||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.tu_ngay); if(!d){ghiBo("nghi",r.tu_ngay);return;} oD(r.campus,d).ng++;});
  (supa||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.ngay); if(!d){ghiBo("supa",r.ngay);return;}
    const o=oD(r.campus,d); o.spc+=+r.so_chua_dat||0; o.spt+=(+r.so_dat||0)+(+r.so_chua_dat||0);});
  (suCo||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.ngay_tao); if(!d){ghiBo("suco",r.ngay_tao);return;} oD(r.campus,d).tk++;});

  const bdCaNgay=[...new Set(Object.keys(bdD).reduce((a,c)=>a.concat(Object.keys(bdD[c])),[]))]
    .filter(d=>d<=homNay).sort();
  // "hom nay" = ngay hoc gan nhat CO DIEM DANH — do la su that van hanh, khong phai ngay he thong
  const ngayCoMat=[...new Set((dd||[]).filter(r=>hopCP(r.campus)).map(r=>chiNgay(r.ngay)).filter(Boolean))]
    .filter(d=>d<=homNay&&!cuoiTuan(d)).sort();
  const bdNgay = ngayCoMat.length ? ngayCoMat[ngayCoMat.length-1]
               : (bdCaNgay.filter(d=>!cuoiTuan(d)).slice(-1)[0]||null);
  const bdTruoc = bdNgay ? [28,21,14,7].map(k=>luiNgay(bdNgay,k)) : [];

  const DO=[
   {ten:"Lead mới",      nhom:"Tuyển sinh", tot: 1, v:o=>o?o.lead:0},
   {ten:"Trẻ có mặt",    nhom:"Vận hành",   tot: 1, v:o=>o?o.dh:null},
   {ten:"Vắng",          nhom:"Vận hành",   tot:-1, v:o=>o?o.vang:null},
   {ten:"Trẻ bắt đầu nghỉ dài",nhom:"Rủi ro", tot:-1, v:o=>o?o.ng:0},
   {ten:"Việc chưa đạt khi kiểm", nhom:"Rủi ro", tot:-1, v:o=>o?o.spc:0},
   {ten:"Sự cố mới",     nhom:"Rủi ro",     tot:-1, v:o=>o?o.tk:0}];
  const oNgay=(c,d)=>(bdD[c]&&bdD[c][d])||null;
  const bdO=(c,m)=>{
    const cur=m.v(oNgay(c,bdNgay));
    const tr=bdTruoc.map(d=>m.v(oNgay(c,d))).filter(x=>x!==null&&x!==undefined);
    // null = that su chua co so (diem danh chua nhap). 0 = co so va bang 0 — KHONG phai thieu du lieu.
    if(cur===null||cur===undefined) return {h:'<span style="opacity:.4">chưa có</span>',tin:0,thieu:1};
    if([cur].concat(tr).every(x=>!x)) return {h:'<span style="opacity:.3">0</span>',tin:0,thieu:0};
    const so=fmt(cur);
    if(tr.length<2) return {h:'<b>'+so+'</b><br><span style="opacity:.4;font-size:10.5px">chưa đủ dữ liệu</span>',tin:0,thieu:0};
    const lo=Math.min.apply(null,tr), hi=Math.max.apply(null,tr);
    let g="·", cls="flat", xau=0;
    if(cur>hi){ xau=m.tot<0?1:0; g="▲"; cls=xau?"down":"up"; }
    else if(cur<lo){ xau=m.tot>0?1:0; g="▼"; cls=xau?"down":"up"; }
    return {h:'<b>'+so+'</b> <span class="'+cls+'">'+g+'</span><br><span style="opacity:.4;font-size:10.5px">dải '+fmt(lo)+"–"+fmt(hi)+"</span>",
            tin:xau, thieu:0};};
  const bdRows=Object.keys(bdD).filter(c=>c&&c!=="(chưa rõ)"&&c!=="TRUNG TÂM"&&c!=="(chưa gán campus)")
    .map(c=>{const o=DO.map(m=>bdO(c,m));
      return {c:c, o:o, tin:o.reduce((a,x)=>a+x.tin,0), thieu:o.reduce((a,x)=>a+x.thieu,0)};})
    .sort((a,b)=>b.tin-a.tin||a.thieu-b.thieu||(a.c<b.c?-1:1));
  const bdMu=bdRows.filter(r=>r.thieu>=2).length;

  // bang theo ngay cho toan he thong — de nhin thay tung ngay, khong phai truu tuong
  const ngayHocGan=bdCaNgay.filter(d=>!cuoiTuan(d)).slice(-7);
  const congNgay=d=>{const t={lead:0,dh:0,vang:0,ng:0,spc:0,tk:0,co:0};
    Object.keys(bdD).forEach(c=>{const o=bdD[c][d]; if(!o)return; t.co=1;
      t.lead+=o.lead||0; t.dh+=o.dh||0; t.vang+=o.vang||0; t.ng+=o.ng||0; t.spc+=o.spc||0; t.tk+=o.tk||0;});
    return t;};
  const ngayCard = !ngayHocGan.length ? "" :
   '<div class="card"><h2>Từng ngày học — toàn cảnh</h2>'
   +'<p class="sub">'+nhanCP+' · 7 ngày học gần nhất · bỏ thứ Bảy và Chủ nhật</p>'
   +'<div class="tw"><table style="min-width:700px"><thead><tr><th>Ngày</th><th>Thứ</th><th>Lead mới</th>'
   +'<th>Trẻ có mặt</th><th>Vắng</th><th>Trẻ bắt đầu nghỉ dài</th><th>Việc chưa đạt khi kiểm</th><th>Sự cố mới</th></tr></thead><tbody>'
   +ngayHocGan.slice().reverse().map(d=>{const t=congNgay(d); const dam=d===bdNgay;
     return "<tr"+(dam?' style="background:var(--soft)"':"")+"><td>"+(dam?"<b>"+d+"</b>":d)+"</td><td>"+tenThu(d)
      +'</td><td class="mono">'+fmt(t.lead)+'</td><td class="mono">'+(t.dh?fmt(t.dh):'<span style="opacity:.3">—</span>')
      +'</td><td class="mono">'+(t.vang?fmt(t.vang):'<span style="opacity:.3">—</span>')
      +'</td><td class="mono">'+(t.ng?'<span class="down">'+fmt(t.ng)+"</span>":"0")
      +'</td><td class="mono">'+(t.spc?'<span class="down">'+fmt(t.spc)+"</span>":"0")
      +'</td><td class="mono">'+(t.tk?'<span class="down">'+fmt(t.tk)+"</span>":"0")+"</td></tr>";}).join("")
   +"</tbody></table></div>"
   +'<p class="leg"><b>Ba cột cuối nghĩa là gì:</b><br>'
   +'· <b>Trẻ bắt đầu nghỉ dài</b> — hôm đó có bao nhiêu bé <i>bắt đầu</i> một đợt nghỉ liền từ 3 buổi học trở lên. '
   +'Đếm ở <b>buổi đầu tiên</b> của đợt nghỉ, đã bỏ thứ Bảy và Chủ nhật. Một bé nghỉ 5 buổi chỉ tính <b>một lần</b>, vào ngày bé nghỉ buổi đầu.<br>'
   +'· <b>Việc chưa đạt khi kiểm</b> — hôm đó người đi kiểm SUPA trả lời “chưa đạt” bao nhiêu câu. '
   +'Đây là số <i>câu</i>, không phải số lần đi kiểm; một lần kiểm có khoảng 7–10 câu.<br>'
   +'· <b>Sự cố mới</b> — hôm đó có bao nhiêu ticket được mở mới (vận hành, hành vi, an toàn, sức khoẻ).</p>'
   +'<p class="leg">Dòng tô đậm là <b>ngày đang xét</b> ở bảng dưới — ngày học gần nhất có điểm danh. '
   +'Ô “—” nghĩa là ngày đó chưa có số, không phải bằng 0.</p></div>';

  // ----- THE: MUC TIEU va THUC TE -----
  // Quyet dinh: MUC TIEU chuan la THANG. Tuan/ngay chi la NHIP (pace), khong phai moc cham diem.
  // Ly do: muc tieu thang / 15 campus / 4 tuan ~ 1,3 hoc sinh mot campus mot tuan.
  // Mot tuan chot 0 roi tuan sau chot 3 khong noi len gi — do tuan cho lag measure nay la do nhieu.
  const ktLoc=(ct||[]).filter(r=>hopCP(r.campus));
  const ktT={}; ktLoc.forEach(r=>{const m=+r.thang; if(!m||m<1||m>12)return;
    const o=ktT[m]||(ktT[m]={thang:m,moi:0,si:0}); o.moi+=+r.tuyen_moi||0; o.si+=+r.si_so_kh||0;});
  const ktDs=Object.keys(ktT).map(k=>ktT[k]).sort((a,b)=>a.thang-b.thang);
  const namNay=+homNay.slice(0,4), thangHT=+homNay.slice(5,7);
  const soNgayThang=m=>new Date(Date.UTC(namNay,m,0)).getUTCDate();
  const soTuanThang=m=>soNgayThang(m)/7;
  const soNgayHoc=m=>{let n=0; const h=soNgayThang(m);
    for(let d=1;d<=h;d++){const w=new Date(Date.UTC(namNay,m-1,d)).getUTCDay(); if(w>=1&&w<=5)n++;} return n;};
  const ngayHocDaQua=m=>{const het=(m===thangHT)? +homNay.slice(8,10) : soNgayThang(m); let n=0;
    for(let d=1;d<=het;d++){const w=new Date(Date.UTC(namNay,m-1,d)).getUTCDay(); if(w>=1&&w<=5)n++;} return n;};
  const ktNay=ktT[thangHT]||null;

  // THUC TE: uu tien v_tuan_campus (dinh nghia goc). Neu view do chet -> dung tam v_lead_campus,
  // nhung day la so COHORT (theo thang TAO lead), khong phai so nhap hoc trong thang -> phai ghi ro.
  const ktCoTw=(tw||[]).length>0;
  const CHOTX=/thành công/i;
  const thucT={}, thucCam={};
  if(ktCoTw){
    (tw||[]).filter(r=>hopCP(r.campus)).forEach(r=>{const m=+String(r.tuan).slice(5,7); if(!m)return;
      thucT[m]=(thucT[m]||0)+(+r.da_di_hoc||0);
      if(m===thangHT) thucCam[r.campus]=(thucCam[r.campus]||0)+(+r.da_di_hoc||0);});
  } else {
    (tsi||[]).filter(r=>r.campus&&hopCP(r.campus)&&CHOTX.test(r.giai_doan||"")).forEach(r=>{
      const d=chiNgay(r.ngay); if(!d||+d.slice(0,4)!==namNay)return; const m=+d.slice(5,7);
      thucT[m]=(thucT[m]||0)+(+r.so_lead||0);
      if(m===thangHT) thucCam[r.campus]=(thucCam[r.campus]||0)+(+r.so_lead||0);});
  }
  const ktCoThuc=Object.keys(thucT).length>0;
  const nhipNay=ktNay? ktNay.moi*ngayHocDaQua(thangHT)/soNgayHoc(thangHT) : null;
  const thucNay=thucT[thangHT]||0;
  const ktCam=ktLoc.filter(r=>+r.thang===thangHT)
    .map(r=>({c:r.campus,moi:+r.tuyen_moi||0,si:+r.si_so_kh||0,
              thuc:(thucCam[r.campus]||0),
              nhip:(+r.tuyen_moi||0)*ngayHocDaQua(thangHT)/soNgayHoc(thangHT)}))
    .filter(r=>r.moi||r.si||r.thuc)
    .sort((a,b)=>(a.thuc-a.nhip)-(b.thuc-b.nhip));   // tut nhip nhieu nhat len truoc
  const ktCard = !ktDs.length ?
   '<div class="card"><h2>Mục tiêu và thực tế</h2>'
   +'<p class="sub">'+nhanCP+' · bảng <code>chi_tieu</code> trả về <b class="down">0 dòng</b></p>'
   +'<div class="q">Chưa có mục tiêu nào để so. Xem thẻ <b>Chẩn đoán nguồn dữ liệu</b> — '
   +'nếu <code>chi_tieu</code> báo lỗi thì bảng hỏng; nếu 0 dòng không lỗi thì file kế hoạch 2026 chưa được nạp lên.</div></div>'
   :
   '<div class="card"><h2>Mục tiêu và thực tế — tháng '+thangHT+'</h2>'
   +'<p class="sub">'+nhanCP+' · mục tiêu từ bảng <code>chi_tieu</code> · thực tế từ <code>'+(ktCoTw?"v_tuan_campus":"v_lead_campus")+"</code></p>"
   +'<div class="kpis">'
   +kpi("Mục tiêu tháng "+thangHT,ktNay?fmt(ktNay.moi):"—","","học sinh mới cả tháng")
   +kpi("Nhịp đến hôm nay",nhipNay==null?"—":dec(nhipNay,1),"",
        "đã qua "+ngayHocDaQua(thangHT)+"/"+soNgayHoc(thangHT)+" ngày học")
   +kpi("Thực tế tháng này",ktCoThuc?fmt(thucNay):"—","",ktCoTw?"lead chuyển sang Kết thúc thành công":"tạm tính — xem ghi chú")
   +kpi("So với nhịp",(!ktCoThuc||nhipNay==null)?"—":
        '<span class="'+(thucNay-nhipNay>=0?"up":"down")+'">'+(thucNay-nhipNay>=0?"+":"")+dec(thucNay-nhipNay,1)+"</span>",
        "","thực tế trừ nhịp — đây là con số cần nhìn")+"</div>"
   +(ktCoTw ? "" : '<div class="gap"><b>Thực tế đang là số tạm, không phải số nhập học trong tháng.</b> '
     +'Nguồn gốc <code>v_tuan_campus</code> đang trả 0 dòng, nên tôi đếm tạm từ <code>v_lead_campus</code>: '
     +'<i>lead TẠO trong tháng đó và nay đã ở trạng thái “Kết thúc thành công”.</i> '
     +'Một phụ huynh vào phễu tháng 8 và nhập học tháng 9 sẽ được tính vào <b>tháng 8</b>. '
     +'Vì vậy các tháng gần đây luôn bị <b>thấp hơn thực tế</b> — lead vừa vào chưa kịp chốt. '
     +'Sửa được <code>v_tuan_campus</code> thì số này tự đúng lại.</div>')
   +'<p class="sub" style="margin:18px 0 6px;text-transform:none;letter-spacing:0">Tháng 7 → 12 — mục tiêu là mốc <b>tháng</b>, tuần chỉ là nhịp</p>'
   +'<div class="tw"><table style="min-width:760px"><thead><tr><th>Tháng</th><th>Mục tiêu tháng</th><th>Thực tế</th><th>Chênh</th><th>% đạt</th>'
   +'<th>Nhịp/tuần (÷4)</th><th>Nhịp/tuần (theo lịch)</th><th>Nhịp/ngày học</th></tr></thead><tbody>'
   +ktDs.filter(r=>r.thang>=7).map(r=>{const th=(ktCoThuc&&thucT[r.thang]!=null)?thucT[r.thang]:null, d=(th==null?null:th-r.moi);
     return "<tr"+(r.thang===thangHT?' style="background:var(--soft)"':"")+"><td>"+(r.thang===thangHT?"<b>Tháng "+r.thang+"</b>":"Tháng "+r.thang)
      +'</td><td class="mono">'+fmt(r.moi)
      +'</td><td class="mono">'+(th==null?'<span style="opacity:.3">—</span>':fmt(th))
      +'</td><td class="mono">'+(d==null?'<span style="opacity:.3">—</span>':'<span class="'+(d>=0?"up":"down")+'">'+(d>=0?"+":"")+fmt(d)+"</span>")
      +'</td><td class="mono">'+(d==null||!r.moi?'<span style="opacity:.3">—</span>':pct(th/r.moi,0))
      +'</td><td class="mono" style="opacity:.6">'+dec(r.moi/4,1)
      +'</td><td class="mono" style="opacity:.6">'+dec(r.moi/soTuanThang(r.thang),1)
      +'</td><td class="mono" style="opacity:.6">'+dec(r.moi/soNgayHoc(r.thang),2)+"</td></tr>";}).join("")
   +'<tr><td><b>Tháng 7–12</b></td><td class="mono"><b>'+fmt(ktDs.filter(r=>r.thang>=7).reduce((a,r)=>a+r.moi,0))+"</b></td>"
   +'<td class="mono"><b>'+(ktCoThuc?fmt(ktDs.filter(r=>r.thang>=7).reduce((a,r)=>a+(thucT[r.thang]||0),0)):"—")+"</b></td>"
   +"<td></td><td></td><td></td><td></td><td></td></tr>"
   +"</tbody></table></div>"
   +'<p class="leg"><b>Vì sao mục tiêu chấm theo tháng chứ không theo tuần:</b> mục tiêu tháng '+thangHT+" ("+(ktNay?fmt(ktNay.moi):"—")
   +') chia cho '+(ktCam.length||1)+' campus rồi chia cho 4 tuần ra <b>'+(ktNay&&ktCam.length?dec(ktNay.moi/ktCam.length/4,1):"—")
   +' học sinh</b> mỗi campus mỗi tuần. Ở mức đó, một tuần chốt 0 rồi tuần sau chốt 2 <i>không nói lên điều gì</i> — '
   +'đó là nhiễu, không phải tín hiệu. Nên: <b>tuần dùng để xem nhịp</b> (đang đi kịp chưa), '
   +'<b>tháng mới dùng để chấm</b>. Còn họp tuần thì đo <b>lead measure</b> — cuộc gọi, tham quan — ở bảng điểm theo ngày phía trên.</p>'
   +'<p class="leg"><b>Ba cột nhịp khác nhau ở mẫu số:</b> ÷4 là quy ước cũ; “theo lịch” chia cho số tuần thật ('
   +dec(soTuanThang(thangHT),2)+' tuần trong tháng '+thangHT+'). Cộng 4 tuần theo quy ước ÷4 sẽ <b>vượt mục tiêu tháng ~'
   +dec((soTuanThang(thangHT)/4-1)*100,0)+'%</b>. Muốn đổi thì sửa <code>METRIC_DEFINITIONS.md</code> — tôi không tự đổi mẫu số.</p>'
   +(ktCam.length ? '<p class="sub" style="margin:18px 0 6px;text-transform:none;letter-spacing:0">Tháng '+thangHT+' theo campus — tụt nhịp nhiều nhất trước</p>'

let CHE="1";
function apDungChe(){
  ["1","2","3"].forEach(z=>{const el=$("z"+z); if(el) el.className="zone"+(z===CHE?" on":"")});
  document.querySelectorAll("#che > button").forEach(b=>{b.className=(b.dataset.z===CHE?"on":"")});
  // o thoi gian chi co nghia o che do 3 -> an di cho khoi hieu nham
  $("oTG").style.display = (CHE==="3") ? "inline-flex" : "none";
}
$("che").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!b.dataset.z)return;
  CHE=b.dataset.z; apDungChe(); window.scrollTo(0,0);
});
