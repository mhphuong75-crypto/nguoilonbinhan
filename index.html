function spark(series){
  if(!series.length) return '<div class="note">Không có dữ liệu trong khoảng này</div>';
  const w=560,h=62,p=3,max=Math.max(...series.map(x=>x.v),1);
  const X=i=>p+i*(w-2*p)/Math.max(series.length-1,1), Y=v=>h-p-(v/max)*(h-2*p-8);
  const pts=series.map((x,i)=>X(i).toFixed(1)+","+Y(x.v).toFixed(1)).join(" ");
  const last=series[series.length-1];
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Xu hướng theo ngày">'
   +'<polygon points="'+p+','+(h-p)+' '+pts+' '+X(series.length-1).toFixed(1)+','+(h-p)+'" fill="var(--accent)" opacity=".13"></polygon>'
   +'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>'
   +'<circle cx="'+X(series.length-1).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="3.4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"></circle></svg>'
   +'<div class="note" style="border:0;padding:0;margin-top:7px;display:flex;justify-content:space-between">'
   +'<span>'+series[0].d.slice(8)+"/"+series[0].d.slice(5,7)+'</span><span>đỉnh <b class="mono">'+fmt(max)+'</b> · gần nhất <b class="mono">'+fmt(last.v)+'</b></span></div>';
}
function delta(cur,prev,goodUp=true){
  if(prev==null||prev===0) return '<div class="d">kỳ trước —</div>';
  const r=(cur-prev)/Math.abs(prev);
  const cls=Math.abs(r)<0.02?"flat":(r>0)===goodUp?"up":"down";
  const a=Math.abs(r)<0.02?"→":r>0?"↑":"↓";
  return '<div class="d"><span class="'+cls+'">'+a+" "+(Math.abs(r)*100).toFixed(0)+'%</span> <span style="opacity:.7">vs '+fmt(prev)+"</span></div>";
}

const escNH = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const campusNH = value => String(value || '').normalize('NFC').trim().replace(/^campus\s+/i, '').replace(/\s+/g, ' ').toLocaleUpperCase('vi-VN');
async function docNhapHocCRM() {
  try {
    const metadata = () => sb.from('nlba_nhap_hoc_crm').select('captured_at', {count:'exact'}).order('captured_at', {ascending:false}).limit(1);
    const first = await metadata();
    if (first.error) throw first.error;
    const stamp = first.data?.[0]?.captured_at;
    if (!stamp || !Number.isInteger(first.count) || first.count < 3750) throw Error('Chưa đọc được snapshot nhập học đầy đủ. Kiểm tra quyền đọc hoặc chạy bookmark nhập học.');
    const rows = [], seen = new Set();
    let expected = null;
    for (let page = 0; page < 40; page++) {
      const result = await sb.from('nlba_nhap_hoc_crm')
        .select('ma_hs,ten_hs,campus,lop,dien_thoai,ngay_nhap_hoc,captured_at', {count:'exact'})
        .eq('captured_at', stamp)
        .order('ma_hs', {ascending:true}).range(page * 500, page * 500 + 499);
      if (result.error) throw result.error;
      if (!Number.isInteger(result.count) || (expected !== null && expected !== result.count)) throw Error('Nguồn nhập học thay đổi giữa lúc đọc. Bấm Tải lại số.');
      expected = result.count;
      for (const row of result.data || []) {
        if (!row.ma_hs || seen.has(row.ma_hs) || row.captured_at !== stamp) throw Error('Snapshot nhập học bị trùng hoặc không nhất quán.');
        seen.add(row.ma_hs); rows.push({...row,campus:campusNH(row.campus)});
      }
      if (rows.length === expected) break;
      if (!result.data?.length || rows.length > expected) throw Error('Nguồn nhập học trả thiếu dữ liệu.');
    }
    if (rows.length !== expected) throw Error('Nguồn nhập học vượt giới hạn hoặc chưa đầy đủ.');
    const last = await metadata();
    if (last.error) throw last.error;
    if (last.count !== first.count || last.data?.[0]?.captured_at !== stamp) throw Error('CRM vừa được đồng bộ trong lúc mở báo cáo. Bấm Tải lại số.');
    return {data:rows,error:null,snapshot:{capturedAt:stamp,totalRecords:first.count,datedRecords:rows.filter(r=>r.ngay_nhap_hoc).length}};
  } catch (error) {
    return {data:null,error:{message:error.message || String(error)},snapshot:null};
  }
}

// Chỉ đề xuất trẻ theo tên + cơ sở. Không đồng nhất mã Tomia với mã CRM.
const tenDoiChieuNH = value => String(value || '').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleUpperCase('vi-VN');
function doiChieuNhapHoc({crm,tomia,lo,hi,CP}) {
  const key = (name,campus) => tenDoiChieuNH(name)+'\u0000'+campusNH(campus);
  const index = (rows,name) => {const map=new Map();for(const row of rows){const k=key(row[name],row.campus);if(!tenDoiChieuNH(row[name])||!campusNH(row.campus))continue;if(!map.has(k))map.set(k,[]);map.get(k).push(row);}return map;};
  const C=index(crm,'ten_hs'),T=index(tomia,'ten_tre');
  const inCampus=r=>!CP||campusNH(r.campus)===campusNH(CP);
  const inWindow=d=>!!d&&d>=lo&&d<=hi;
  const findings=[],pairs=new Set();
  let sameDay=0;
  function add(t,c,kind,reason) {
    const pair=(t?.ma_tre||'')+'\u0000'+(c?.ma_hs||'')+'\u0000'+kind;
    if(pairs.has(pair))return;pairs.add(pair);
    findings.push({tomia:t||null,crm:c||null,kind,reason});
  }
  const describe=(t,c)=>{
    if(!c.ngay_nhap_hoc)return ['crm_no_date','Trẻ CRM trùng tên + cơ sở nhưng trống ngày nhập học'];
    if(c.ngay_nhap_hoc!==t.ngay_dau)return ['different_date','Trẻ trùng tên + cơ sở có ngày khác nhau'];
    return null;
  };
  for(const t of tomia.filter(r=>inCampus(r)&&inWindow(r.ngay_dau))) {
    const k=key(t.ten_tre,t.campus),candidates=C.get(k)||[],twins=T.get(k)||[];
    if(!candidates.length){
      const other=crm.filter(r=>tenDoiChieuNH(r.ten_hs)===tenDoiChieuNH(t.ten_tre));
      if(other.length)other.forEach(c=>add(t,c,'other_campus','Tên trùng nhưng khác hoặc thiếu cơ sở — cần xác minh'));
      else add(t,null,'tomia_only','Chưa tìm thấy trẻ cùng tên trong snapshot CRM');
    }else if(candidates.length!==1||twins.length!==1){
      candidates.forEach(c=>add(t,c,'ambiguous','Trùng tên + cơ sở có nhiều mã — chưa ghép được'));
    }else{
      const difference=describe(t,candidates[0]);
      if(difference)add(t,candidates[0],...difference);else sameDay++;
    }
  }
  for(const c of crm.filter(r=>inCampus(r)&&inWindow(r.ngay_nhap_hoc))) {
    const k=key(c.ten_hs,c.campus),candidates=T.get(k)||[],twins=C.get(k)||[];
    if(!candidates.length){
      const other=tomia.filter(r=>tenDoiChieuNH(r.ten_tre)===tenDoiChieuNH(c.ten_hs));
      if(other.length)other.forEach(t=>add(t,c,'other_campus','Tên trùng nhưng khác hoặc thiếu cơ sở — cần xác minh'));
      else add(null,c,'crm_only','Chưa tìm thấy trẻ cùng tên trong dữ liệu Tomia đang có');
    }else if(candidates.length!==1||twins.length!==1){
      candidates.forEach(t=>add(t,c,'ambiguous','Trùng tên + cơ sở có nhiều mã — chưa ghép được'));
    }else{
      const difference=describe(candidates[0],c);if(difference)add(candidates[0],c,...difference);
    }
  }
  return {findings,sameDay,
    tomiaInWindow:tomia.filter(r=>inCampus(r)&&inWindow(r.ngay_dau)).length,
    crmInWindow:crm.filter(r=>inCampus(r)&&inWindow(r.ngay_nhap_hoc)).length};
}
function taoBangDoiChieuNH({crm,tomia,month,homNay,CP,through,error}) {
  if(error||!through)return '<div class="gap"><b>Chưa lập được danh sách đối chiếu.</b> Chưa đọc đủ dữ liệu Tomia hoặc chưa xác minh được ngày điểm danh gần nhất. Không diễn giải danh sách trống là không có chênh lệch.</div>';
  const y=+month.slice(0,4),m=+month.slice(5,7),end=new Date(Date.UTC(y,m,0)).toISOString().slice(0,10);
  const hi=[homNay,through,end].sort()[0],lo=month+'-01';

  const result=doiChieuNhapHoc({crm:crm||[],tomia:tomia||[],lo,hi,CP});
  const visible=new Set(result.findings.map(r=>r.tomia?'T:'+r.tomia.ma_tre:'C:'+r.crm.ma_hs));

  const row=r=>{const t=r.tomia||{},c=r.crm||{};return '<tr><td>'+escNH(r.reason)+'</td><td>'+escNH(t.ten_tre||c.ten_hs||'—')+'</td><td>'+escNH(t.ma_tre||'—')+'</td><td>'+escNH(c.ma_hs||'—')+'</td><td>'+escNH(t.campus||'—')+'</td><td>'+escNH(c.campus||'—')+'</td><td>'+escNH(t.lop||'—')+'</td><td>'+escNH(c.lop||'—')+'</td><td>'+escNH(t.ngay_dau||'—')+'</td><td>'+escNH(c.ngay_nhap_hoc||'—')+'</td></tr>';};
  let html='<h3>Danh sách cần đối chiếu CRM – Tomia</h3><p class="leg">Cùng khoảng <b>'+lo+' → '+hi+'</b> · Tomia có điểm danh gần nhất đến <b>'+escNH(through)+'</b>. Trong khoảng này: Tomia '+fmt(result.tomiaInWindow)+' mã; CRM '+fmt(result.crmInWindow)+' mã. Ngày sau mốc này không bị quy thành thiếu hồ sơ.</p>'
    +'<div class="q"><b>Đây là danh sách đề nghị kiểm tra.</b> Hai hệ thống dùng mã khác nhau; tên + cơ sở chỉ tạo trẻ ghép. Cần xác nhận đúng trẻ trước khi cập nhật CRM. Tên lớp được đặt khác nhau có thể chỉ là khác cách gọi. Không dùng chênh tổng số để suy ra số học sinh thiếu hồ sơ.</div>'
    +'<p class="leg">Có '+fmt(result.sameDay)+' trẻ duy nhất trùng tên + cơ sở + ngày (chưa xác minh danh tính). Danh sách dưới có '+fmt(visible.size)+' mã phía đang kiểm tra và '+fmt(result.findings.length)+' dòng trẻ; một mã có thể có nhiều trẻ.</p>';
  for(const [kind,title] of groups){const found=result.findings.filter(r=>r.kind===kind);if(!found.length)continue;
    html+='<details style="margin:12px 0" open><summary style="cursor:pointer"><b>'+title+'</b> · '+fmt(found.length)+' dòng trẻ</summary><div class="tw"><table style="min-width:1200px"><thead><tr><th>Cần kiểm tra</th><th>Học sinh</th><th>Mã Tomia</th><th>Mã CRM</th><th>Cơ sở Tomia</th><th>Cơ sở CRM</th><th>Lớp Tomia</th><th>Lớp CRM</th><th>Ngày đầu Tomia</th><th>Ngày nhập học CRM</th></tr></thead><tbody>'+found.map(row).join('')+'</tbody></table></div></details>';
  }
  if(!result.findings.length)html+='<p class="leg">Chưa phát hiện khác biệt theo quy tắc tên + cơ sở + ngày trong phạm vi dữ liệu hiện có. Điều này không thay thế việc xác nhận mã học sinh giữa hai hệ thống.</p>';
  return html+'<p class="leg"><b>Cách xử lý:</b> kiểm tra danh tính → đối chiếu ngày nhập học và ngày điểm danh → kiểm tra cơ sở/lớp → cập nhật nguồn đúng nếu cần → chạy bookmark nguồn tương ứng và Tải lại số. Không sửa CRM chỉ để tổng hai nguồn bằng nhau.</p>';
}
async function docTomiaNhapHocDoiChieu() {
  try {
    const rows=[],seen=new Set();let expected=null;
    for(let page=0;page<40;page++){
      const result=await sb.from('mv_nhap_hoc').select('ma_tre,ten_tre,lop,campus,ngay_dau',{count:'exact'}).order('ma_tre').range(page*500,page*500+499);
      if(result.error)throw result.error;
      if(!Number.isInteger(result.count)||(expected!==null&&expected!==result.count))throw Error('Tomia thay đổi trong lúc đọc. Tải lại số.');expected=result.count;
      for(const r of result.data||[]){if(!r.ma_tre||seen.has(r.ma_tre))throw Error('Tomia trùng mã hoặc lặp trang.');seen.add(r.ma_tre);rows.push({...r,campus:campusNH(r.campus)});}
      if(rows.length===expected)break;
      if(!result.data?.length||rows.length>expected)throw Error('Tomia trả thiếu danh sách.');
    }
    if(rows.length!==expected)throw Error('Chưa đọc đủ danh sách Tomia.');
    const latest=await sb.from('tomia_diem_danh').select('ngay').order('ngay',{ascending:false}).limit(1);
    if(latest.error)throw latest.error;
    return {data:rows,error:null,snapshot:{throughDate:latest.data?.[0]?.ngay||null,totalRecords:rows.length}};
  }catch(error){return {data:null,error:{message:error.message||String(error)},snapshot:null};}
}
function kiemTraDongBoSupa(syncAt,hasRows,readError,now){
  const stamp=Date.parse(syncAt);
  if(readError)return {ok:false,hours:null,message:'Chưa tải được bảng kiểm việc SUPA'};
  if(!Number.isFinite(stamp))return {ok:false,hours:null,message:'Chưa xác minh được lần đồng bộ SUPA'};
  const hours=Math.max(0,(now-stamp)/3600000);
  if(stamp>now+120000||hours>30)return {ok:false,hours:Math.round(hours),message:'SUPA chưa có lần đồng bộ mới trong 30 giờ'};
  if(!hasRows)return {ok:false,hours:Math.round(hours),message:'Đã nhận lần đồng bộ nhưng chưa có dữ liệu kiểm việc'};
  return {ok:true,hours:Math.round(hours),message:'Bình thường — đã đồng bộ và tải được dữ liệu kiểm việc'};
}

function kiemTraDongBoLead(rows,error,now){
  if(error)return {ok:false,day:null,hours:null,message:'Chưa tải được tổng lead tuyển sinh'};
  const stamps=(rows||[]).map(r=>Date.parse(r.snapshot_ts)).filter(Number.isFinite);
  if(!stamps.length)return {ok:false,day:null,hours:null,message:'Chưa có mốc đồng bộ tổng lead'};
  const latest=Math.max(...stamps),hours=Math.max(0,(now-latest)/3600000);
  const day=new Date(latest+7*3600000).toISOString().slice(0,10);
  const ok=latest<=now+120000&&hours<=30;
  return {ok,day,hours:Math.round(hours),message:ok?'Bình thường — tổng lead đã tải thành công':'Tổng lead chưa có lần đồng bộ mới trong 30 giờ'};
}

// b68: tách lưu trữ khỏi nghỉ phép; chưa có bằng chứng trạng thái đang học.
function tachNghiPhepVaLuuTru({episodes,archived,CP,campusMap}) {
  const id=r=>String(r.ma_tre||'').trim();
  const archivedById=new Map();
  for(const a of archived||[]){if(!id(a))continue;const previous=archivedById.get(id(a));if(!previous||String(a.archived_at||'')>String(previous.archived_at||''))archivedById.set(id(a),a);}
  const latest=new Map(),allById=new Map();
  for(const r of episodes||[]){if(!id(r))continue;allById.set(id(r),r);const old=latest.get(id(r));if(!old||String(r.den_ngay||'')>String(old.den_ngay||'')||(r.den_ngay===old.den_ngay&&String(r.tu_ngay||'')>String(old.tu_ngay||'')))latest.set(id(r),r);}
  const match=r=>!CP||campusNH(r.campus)===campusNH(CP);
  const archivedRows=[];
  for(const [ma,a] of archivedById){const episode=allById.get(ma);const campus=campusMap?.[a.campus_code]||episode?.campus||a.campus_code||'';
    const row={...a,ma_tre:ma,ten_tre:a.ten||episode?.ten_tre||ma,lop:episode?.lop||null,campus};if(match(row))archivedRows.push(row);}
  const candidates=[],otherAbsences=[];
  for(const r of latest.values()){
    if(!match(r)||archivedById.has(id(r))||r.chua_quay_lai!==true||Number(r.so_buoi)<3)continue;
    const reason=String(r.ly_do||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
    if(reason==='co phep')candidates.push(r);else otherAbsences.push(r);
  }
  const sort=(a,b)=>String(a.campus).localeCompare(String(b.campus))||String(a.ten_tre).localeCompare(String(b.ten_tre));
  return {archived:archivedRows.sort(sort),candidates:candidates.sort(sort),otherAbsences:otherAbsences.sort(sort)};
}
function taoTheNghiPhep({episodes,archived,CP,campusMap,through,episodeError,archiveError,attendance,attendanceError}) {
  const groups=tachNghiPhepVaLuuTru({episodes,archived,CP,campusMap});
  const rows=groups.candidates.slice().sort((a,b)=>(+b.so_buoi||0)-(+a.so_buoi||0)||String(a.ten_tre||'').localeCompare(String(b.ten_tre||'')));
  const five=rows.filter(r=>Number(r.so_buoi)>=5);
  const ready=!episodeError&&!archiveError;
  const enrollmentValid=!attendanceError&&attendance&&['di_hoc','vang'].every(k=>attendance[k]!=null&&Number.isFinite(Number(attendance[k]))&&Number(attendance[k])>=0);
  const enrolled=enrollmentValid?Number(attendance.di_hoc)+Number(attendance.vang):0;
  const rateValid=ready&&enrollmentValid&&enrolled>0&&five.length<=enrolled;
  const rate=rateValid?pct(five.length/enrolled,1):'—';
  let out='<div class="card"><h2>Học sinh nghỉ phép dài ngày</h2><p class="sub">'+escNH(CP||'Toàn hệ thống')+' · điểm danh Tomia · mỗi mã học sinh một dòng</p>'
    +'<div class="kpis">'+kpi('Nghỉ phép từ 3 ngày',ready?fmt(rows.length):'—','','ngày học liên tiếp · gồm cả nhóm từ 5 ngày')
    +kpi('Nghỉ phép từ 5 ngày',ready?fmt(five.length):'—','','ngày học liên tiếp · nằm trong nhóm từ 3 ngày')
    +kpi('Tỷ lệ nghỉ phép từ 5 ngày',rate,'',rateValid?fmt(five.length)+' trẻ nghỉ phép / '+fmt(enrolled)+' trẻ có mặt + vắng · '+escNH(attendance.ngay):'Chưa đủ dữ liệu để tính tỷ lệ')+'</div>';

function thongBaoLamMoiTomia(result) {
  if (result?.error) return '<p class="note">Chưa đọc được trạng thái làm mới bảng tổng hợp.</p>';
  const row = result?.data?.[0];
  if (!row) return "";
  let details;
  try { details = JSON.parse(row.message || "{}"); }
  catch { return '<p class="note">Chưa xác định được trạng thái làm mới bảng tổng hợp.</p>'; }
  if (row.source === "tomia_refresh_request") {
    return '<p class="note">Đang chờ làm mới bảng tổng hợp. Tối đa 3 lần, cách nhau 5 phút.</p>';
  }
  if (row.status === "ok") {
    const stamp = new Date(row.run_at);
    const at = Number.isFinite(+stamp) ? stamp.toLocaleString("vi-VN", {timeZone:"Asia/Ho_Chi_Minh"}) : "";
    return '<p class="leg">Bảng tổng hợp đã làm mới thành công'+(at?' · '+at:'')+'.</p>';
  }
  return Number(details.attempt) >= 3
    ? '<p class="note">Làm mới bảng tổng hợp đã dừng sau 3 lần chưa thành công. Cần kiểm tra nhật ký xử lý.</p>'

}

async function ganTenTreSuCo(rows) {
  const month = new Date(Date.now() + 7 * 3600000).toISOString().slice(0,7);
  const current = rows.filter(r=>String(r.ngay_tao||"").slice(0,7)===month);
  const names = new Map();
  try {
    const ids = current.map(r=>r.ma_ticket);
    for (let start=0; start<ids.length; start+=200) {
      let expected=null, loaded=0;
      const seen=new Set();
      for (let page=0; page<100; page++) {
        const result=await sb.from("tomia_ticket_tre").select("ma_ticket,ma_tre,ten_tre",{count:"exact"})
          .in("ma_ticket",ids.slice(start,start+200))
          .order("ma_ticket",{ascending:true}).order("ma_tre",{ascending:true})
          .range(page*500,page*500+499);
        if(result.error) throw result.error;
        if(!Array.isArray(result.data)||!Number.isInteger(result.count)||(expected!==null&&expected!==result.count)) throw Error("Chưa đọc đủ tên trẻ");
        expected=result.count;
        for(const child of result.data) {
          const key=child.ma_ticket+"|"+child.ma_tre;
          if(seen.has(key)) throw Error("Dữ liệu tên trẻ bị lặp trang");
          seen.add(key);loaded++;
          const name=String(child.ten_tre||"").trim();
          if(name) {if(!names.has(child.ma_ticket))names.set(child.ma_ticket,new Set());names.get(child.ma_ticket).add(name);}
        }
        if(loaded===expected) break;
        if(!result.data.length||loaded>expected||page===99) throw Error("Chưa đọc hết tên trẻ");
      }
    }
    for(const row of current) row.ten_tre=[...(names.get(row.ma_ticket)||[])];
  } catch(error) {
    for(const row of current) {row.ten_tre=[];row.ten_tre_error=true;}
  }
  return {data:rows,error:null};
}

async function docSuCoTomia() {
  const rows = [], seen = new Set();
  let expected = null;
  for (let page = 0; page < 100; page++) {
    const result = await sb.from("v_su_co")
      .select("ma_ticket,ngay_tao,campus,phan_loai,muc_do,trang_thai,tieu_de,nguoi_tao,nguoi_duoc_giao,ngay_dong,so_ngay_mo,con_mo,he_trong,so_tre_lq", {count:"exact"})
      .order("ma_ticket", {ascending:true}).range(page * 500, page * 500 + 499);
    if (result.error) throw result.error;
    if (!Array.isArray(result.data) || !Number.isInteger(result.count) ||
        (expected !== null && expected !== result.count)) {
      throw Error("Nguồn sự cố Tomia thay đổi hoặc chưa đọc đủ. Bấm Tải lại số.");
    }
    expected = result.count;
    for (const row of result.data) {
      if (!row.ma_ticket || seen.has(row.ma_ticket)) throw Error("Nguồn sự cố Tomia bị thiếu mã hoặc trùng trang.");
      seen.add(row.ma_ticket);
      rows.push(row);
    }
    if (rows.length === expected) return await ganTenTreSuCo(rows);
    if (!result.data.length || rows.length > expected) throw Error("Nguồn sự cố Tomia trả thiếu dữ liệu.");
  }
  throw Error("Chưa đọc hết nguồn sự cố Tomia.");
}

// Ban 25 truy van cung luc lam Postgres tranh CPU voi chinh no -> view nang bi
// "canceling statement due to statement timeout". Chay theo lo nho, view nang di truoc.
const SONG_SONG=4;
const THU_TU=TEN_NGUON.map((t,i)=>i)
  .sort((a,b)=>(TEN_NGUON[b].indexOf("v_")===0?1:0)-(TEN_NGUON[a].indexOf("v_")===0?1:0));
const HET_GIO=/timeout|canceling statement/i;
const bocMot=async(CP,i)=>{
  const t=performance.now(); let r=null, thu=0;
  for(let lan=0;lan<2;lan++){
    thu++;
    try{ r=await (TEN_NGUON[i]==="v_su_co" ? docSuCoTomia() : TEN_NGUON[i]==="nlba_nhap_hoc_crm" ? docNhapHocCRM() : TEN_NGUON[i]==="mv_nhap_hoc" ? docTomiaNhapHocDoiChieu() : TEN_NGUON[i]==="amis_opportunity (mốc riêng)" ? docMocTuyenSinhAmis() : taoTruyVan(CP)[i]); }
    catch(e){ r={data:null,error:{message:String(e&&e.message||e)}}; }
    if(!r||!r.error||!HET_GIO.test(r.error.message||"")) break;
    await new Promise(s=>setTimeout(s,700));     // het gio -> nghi mot nhip roi thu lai dung 1 lan
  }
  r=r||{data:null,error:{message:"không rõ"}};
  r.__ms=Math.round(performance.now()-t); r.__i=i; r.__thu=thu; return r;
};
async function chayTheoLo(CP, ds){
  const kq={}; let k=0;
  const tho=async()=>{ while(k<ds.length){ const i=ds[k++]; kq[i]=await bocMot(CP,i); } };
  await Promise.all(Array.from({length:Math.min(SONG_SONG,ds.length)},tho));
  return kq;
}
async function napKho(CP, ep){
  if(!ep && KHO){
    if(KHO.cp===CP) return KHO.kq;                     // khong doi gi -> dung lai het
    const m=await chayTheoLo(CP, LOC_CAMPUS);           // doi campus -> chi goi lai 2 truy van
    const kq=KHO.kq.slice(); LOC_CAMPUS.forEach(i=>{kq[i]=m[i];});
    KHO={t:KHO.t, tLoc:new Date(), cp:CP, kq:kq, tong:KHO.tong}; return kq;
  }
  const t0=performance.now();
  const m=await chayTheoLo(CP, THU_TU);
  const kq=TEN_NGUON.map((_,i)=>m[i]);
  KHO={t:new Date(), tLoc:new Date(), cp:CP, kq:kq, tong:Math.round(performance.now()-t0)};
  return kq;
}

const TuyenSinh=(()=>{
  const campuses=['BITIS','CỦ CHI','HOÀNG VĂN THỤ','HỒ TÂY','KIM MÃ','LINH ĐÀM','NGUYỄN TRỌNG TUYỂN','PHAN CHU TRINH','QUẢNG AN','QUỐC TỬ GIÁM','TÂN ĐỊNH','TÂN THUẬN','THẢO ĐIỀN','VSIP','VƯỜN ĐÀO'];
  const e=escNH, cp=campusNH, norm=ten=>String(ten||'').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleUpperCase('vi-VN');
  const iso=d=>d.toISOString().slice(0,10), short=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'—';
  let state=null, month=null, detail=null, filter='all',sourceCache=null;
  async function source(force){
    if(sourceCache&&!force)return sourceCache;
    try{
      const result=await sb.from('nlba_tuyen_sinh_daily_snapshot').select('snapshot_ts,source,deposit_rows,expected_rows,union_rows,data').order('snapshot_ts',{ascending:false}).limit(1);
      if(result.error)throw result.error;
      const r=result.data?.[0];
      if(!r||!Array.isArray(r.data))throw Error('Chưa nhận được dữ liệu tổng hợp Tuyển sinh');
      const seen=new Set(),fields=['dat_coc','du_kien_co_coc','du_kien_chua_coc','lich_tat_ca'];
      let deposits=0,expected=0;
      for(const x of r.data){
        const k=cp(x.campus)+'|'+x.ngay;
        if(!x.campus||!/^\d{4}-\d{2}-\d{2}$/.test(x.ngay)||seen.has(k)||fields.some(f=>!Number.isInteger(x[f])||x[f]<0)||x.du_kien_co_coc+x.du_kien_chua_coc>x.lich_tat_ca)throw Error('Dữ liệu Tuyển sinh chưa nhất quán');
        seen.add(k);deposits+=x.dat_coc;expected+=x.lich_tat_ca;
      }
      if(deposits!==r.deposit_rows||expected!==r.expected_rows)throw Error('Chưa nhận đủ số tổng hợp Tuyển sinh');
      return sourceCache={stamp:r.snapshot_ts,rows:r.data.map(x=>({...x,campus:cp(x.campus)})),error:null};
    }catch(error){return sourceCache={stamp:null,rows:[],error:error.message||String(error)};}
  }
  function sourceReady(){return !state.source?.error&&!!state.source?.stamp&&Array.isArray(state.source?.rows);}
  function sum(c,key,lo=month+'-01',hi=month+'-31'){
    return (state.source?.rows||[]).filter(r=>(!c||r.campus===c)&&r.ngay>=lo&&r.ngay<=hi).reduce((n,r)=>n+(r[key]||0),0);
  }
  function metrics(c){
    const actual=actualRows(c).length,g=goal(c),readyForecast=ready()&&sourceReady();
    const future=sum(c,'du_kien_co_coc',state.homNay>=month+'-01'?iso(new Date(Date.parse(state.homNay+'T00:00:00Z')+864e5)):month+'-01',month+'-31');
    return {actual,goal:g,future:sourceReady()?future:null,forecast:readyForecast?actual+future:null,gap:readyForecast&&g!==null?Math.max(0,g-actual-future):null};
  }
  function weeks(m){
    const end=iso(new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0))), out=[];
    let d=m+'-01';
    while(d<=end){const a=new Date(d+'T00:00:00Z'),dow=a.getUTCDay();a.setUTCDate(a.getUTCDate()+(dow===0?0:7-dow));const hi=iso(a)>end?end:iso(a);out.push({lo:d,hi,label:short(d)+(hi===d?'':'–'+short(hi))});a.setTime(Date.parse(hi+'T00:00:00Z')+864e5);d=iso(a);}

    const d=chiNgay(r.ngay); if(!d){ghiBo("diemdanh",r.ngay);return;}
    const o=oD(r.campus,d); o.dh=(o.dh||0)+(+r.di_hoc||0); o.vang=(o.vang||0)+(+r.vang||0);});
  (nghi||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.tu_ngay); if(!d){ghiBo("nghi",r.tu_ngay);return;} oD(r.campus,d).ng++;});
  (supa||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.ngay); if(!d){ghiBo("supa",r.ngay);return;}
    const o=oD(r.campus,d); o.spc+=+r.so_chua_dat||0; o.spt+=(+r.so_dat||0)+(+r.so_chua_dat||0);});
  (suCo||[]).filter(r=>r.campus&&hopCP(r.campus)).forEach(r=>{
    const d=chiNgay(r.ngay_tao); if(!d){ghiBo("suco",r.ngay_tao);return;} oD(r.campus,d).tk++;});

  const bdCaNgay=[...new Set(Object.keys(bdD).reduce((a,c)=>a.concat(Object.keys(bdD[c])),[]))]
    .filter(d=>d<=homNay).sort();
  // "hom nay" = ngay hoc gan nhat CO DIEM DANH — do la su that van hanh, khong phai ngay he thong
  const ngayCoMat=[...new Set((dd||[]).filter(r=>hopCP(r.campus)).map(r=>chiNgay(r.ngay)).filter(Boolean))]
    .filter(d=>d<=homNay&&!cuoiTuan(d)).sort();
  const bdNgay = ngayCoMat.length ? ngayCoMat[ngayCoMat.length-1]
               : (bdCaNgay.filter(d=>!cuoiTuan(d)).slice(-1)[0]||null);
  const bdTruoc = bdNgay ? [28,21,14,7].map(k=>luiNgay(bdNgay,k)) : [];

  const DO=[
   {ten:"Lead mới",      nhom:"Tuyển sinh", tot: 1, v:o=>o?o.lead:0},
   {ten:"Trẻ có mặt",    nhom:"Vận hành",   tot: 1, v:o=>o?o.dh:null},
   {ten:"Vắng",          nhom:"Vận hành",   tot:-1, v:o=>o?o.vang:null},
   {ten:"Trẻ bắt đầu nghỉ dài",nhom:"Rủi ro", tot:-1, v:o=>o?o.ng:0},
   {ten:"Việc chưa đạt khi kiểm", nhom:"Rủi ro", tot:-1, v:o=>o?o.spc:0},
   {ten:"Sự cố mới",     nhom:"Rủi ro",     tot:-1, v:o=>o?o.tk:0}];
  const oNgay=(c,d)=>(bdD[c]&&bdD[c][d])||null;
  const bdO=(c,m)=>{
    const cur=m.v(oNgay(c,bdNgay));
    const tr=bdTruoc.map(d=>m.v(oNgay(c,d))).filter(x=>x!==null&&x!==undefined);
    // null = that su chua co so (diem danh chua nhap). 0 = co so va bang 0 — KHONG phai thieu du lieu.
    if(cur===null||cur===undefined) return {h:'<span style="opacity:.4">chưa có</span>',tin:0,thieu:1};
    if([cur].concat(tr).every(x=>!x)) return {h:'<span style="opacity:.3">0</span>',tin:0,thieu:0};
    const so=fmt(cur);
    if(tr.length<2) return {h:'<b>'+so+'</b><br><span style="opacity:.4;font-size:10.5px">chưa đủ dữ liệu</span>',tin:0,thieu:0};
    const lo=Math.min.apply(null,tr), hi=Math.max.apply(null,tr);
    let g="·", cls="flat", xau=0;
    if(cur>hi){ xau=m.tot<0?1:0; g="▲"; cls=xau?"down":"up"; }
    else if(cur<lo){ xau=m.tot>0?1:0; g="▼"; cls=xau?"down":"up"; }
    return {h:'<b>'+so+'</b> <span class="'+cls+'">'+g+'</span><br><span style="opacity:.4;font-size:10.5px">dải '+fmt(lo)+"–"+fmt(hi)+"</span>",
            tin:xau, thieu:0};};
  const bdRows=Object.keys(bdD).filter(c=>c&&c!=="(chưa rõ)"&&c!=="TRUNG TÂM"&&c!=="(chưa gán campus)")
    .map(c=>{const o=DO.map(m=>bdO(c,m));
      return {c:c, o:o, tin:o.reduce((a,x)=>a+x.tin,0), thieu:o.reduce((a,x)=>a+x.thieu,0)};})
    .sort((a,b)=>b.tin-a.tin||a.thieu-b.thieu||(a.c<b.c?-1:1));
  const bdMu=bdRows.filter(r=>r.thieu>=2).length;

  // bang theo ngay cho toan he thong — de nhin thay tung ngay, khong phai truu tuong
  const ngayHocGan=bdCaNgay.filter(d=>!cuoiTuan(d)).slice(-7);
  const congNgay=d=>{const t={lead:0,dh:0,vang:0,ng:0,spc:0,tk:0,co:0};
    Object.keys(bdD).forEach(c=>{const o=bdD[c][d]; if(!o)return; t.co=1;
      t.lead+=o.lead||0; t.dh+=o.dh||0; t.vang+=o.vang||0; t.ng+=o.ng||0; t.spc+=o.spc||0; t.tk+=o.tk||0;});
    return t;};
  // canh bao tre du lieu: dem so NGAY HOC da qua ma chua co diem danh
  // b29: KHONG tinh hom nay (t<h) — hom nay diem danh con dang dien ra, chua the goi la "thieu".
  // Chi dem ngay hoc (T2-T6) da HOAN TAT giua a va hom nay. Cuoi tuan + hom nay khong bao gio bi ke la thieu.
  const ngayHocTuDen=(a,b2)=>{let n=0,t=new Date(a+"T00:00:00Z"),h=new Date(b2+"T00:00:00Z");
    t.setUTCDate(t.getUTCDate()+1);
    while(t<h){const w=t.getUTCDay(); if(w>=1&&w<=5)n++; t.setUTCDate(t.getUTCDate()+1);} return n;};

  // ===== b12: SUC KHOE DU LIEU — noi ro dang tac o cua nao =====
  // Ba cua giua "du lieu ton tai" va "CEO nhin thay":
  //   cua 1 = co ai bam dau trang keo ve chua        (stg_raw.ts, view v_tuoi_du_lieu)
  //   cua 2 = job GitHub da boc file thanh so chua   (ngay moi nhat trong bang da boc)
  //   cua 3 = trinh duyet dang giu so cu             (nut ↻ o dau trang)
  const maxNg=(arr,k)=>{let m=null;(arr||[]).forEach(r=>{const d=chiNgay(r[k]); if(d&&(!m||d>m))m=d;});return m;};
  // tinh tuoi tu MOC THOI GIAN, khong tin cot so_gio may chu tra ve
  const tDL={}; (tuoiDL||[]).forEach(r=>{
    const t=r.lan_cuoi?new Date(r.lan_cuoi):null;
    const g=(t&&!isNaN(t.getTime()))?((Date.now()-t.getTime())/3600000):(r.so_gio==null?null:+r.so_gio);
    tDL[r.nguon]={gio:(g==null?null:Math.round(g)), luc:r.lan_cuoi};
  });
  // neu view v_tuoi_du_lieu chua duoc tao thi khong doan bua ve cua 1 — chi xet cua 2
  const coTuoi=Array.isArray(tuoiDL)&&tuoiDL.length>0;
  const lichNgay=d=>d?Math.round((new Date(homNay+"T00:00:00Z")-new Date(d+"T00:00:00Z"))/864e5):null;
  const doTuoi=g=>g==null?"chưa bao giờ":(g<1?"vừa xong":(g<24?g+" giờ trước":Math.round(g/24)+" ngày trước"));

  // b22 — CUA 2B: file da boc thanh so roi, nhung BANG TINH SAN (mv_*) chua duoc lam moi.
  // App chi doc mv_*, nen neu lan lam moi cuoi cung XAY RA TRUOC luc file ve kho thi
  // so cu la do buoc lam moi, KHONG phai job boc so tren GitHub. Hai cua khac nhau, hai cach sua khac nhau.
  const lmLuc=(function(){
    const r=(lamMoi||[]).filter(x=>x&&x.ten==="kho")[0];
    const t=(r&&r.luc)?new Date(r.luc):null;
    return (t&&!isNaN(t.getTime()))?t:null;})();
  const lmGio = lmLuc ? Math.round((Date.now()-lmLuc.getTime())/3600000) : null;

  // b13: truy van CHET khac han voi truy van TRA VE RONG. Phai tach hai thu nay.
  const TEN_VIET={"mv_lead_campus":"phễu lead theo campus","mv_tuan_campus":"bảng tuần từng campus",
   "mv_can_ly_do":"lý do im lặng","mv_cohort_tuan":"cohort tuần","mv_viec_tuan":"việc trong tuần",
   "mv_danh_sach":"danh sách gọi","v_diem_danh":"điểm danh","mv_nghi_chuoi":"trẻ nghỉ dài",
   "v_su_co":"sự cố","mv_nhap_hoc":"ngày đầu ghi nhận Tomia","nlba_nhap_hoc_crm":"nhập học CRM Học sinh","mv_supa":"kiểm việc SUPA","v_harasocial":"tin nhắn Harasocial",
   "ga4_daily_channel":"Google Analytics","meta_campaign_daily":"Meta Ads"};
  const vietTen=n=>TEN_VIET[n]||n;
  const bangChet=ds=>ds.filter(n=>{const i=TEN_NGUON.indexOf(n); return i>=0 && KQ[i] && KQ[i].error;});

  const SK=[
   {ten:"Tomia — điểm danh",      kho:"Tomia",      den:bdNgay,              tay:true, do:"hoc",  han:1,
    bang:["v_diem_danh","mv_nghi_chuoi","v_su_co","mv_nhap_hoc"]},
   {ten:"SUPA — kiểm việc",       kho:"SUPA",       den:maxNg(supa,"ngay"),  tay:true, do:"hoc",  han:1,
    bang:["mv_supa"]},
   {ten:"AMIS — tuyển sinh",      kho:"AMIS",       den:maxNg(tsi,"ngay"),   tay:true, do:"hoc",  han:1,
    bang:["mv_lead_campus","mv_tuan_campus","mv_can_ly_do","mv_cohort_tuan","mv_viec_tuan","mv_danh_sach"]},
   {ten:"Harasocial — tin nhắn",  kho:"Harasocial", den:maxNg(hara,"ngay"),  tay:true, do:"lich", han:1,
    bang:["v_harasocial"]},
   {ten:"Google Analytics",       kho:null,         den:maxNg(ga,"day"),     tay:false, do:"lich", han:3,
    bang:["ga4_daily_channel"]},
   {ten:"Meta Ads",               kho:null,         den:maxNg(mc,"day"),     tay:false, do:"lich", han:3,
    bang:["meta_campaign_daily"]}
  ].map(x=>{
    if(x.kho==="SUPA"){
      const sync=kiemTraDongBoSupa(tDL.SUPA?.luc,Array.isArray(supa)&&supa.length>0,
        !!KQ[TEN_NGUON.indexOf('mv_supa')]?.error||!!KQ[TEN_NGUON.indexOf('v_tuoi_du_lieu')]?.error,Date.now());
      return Object.assign({},x,{gio:sync.hours,cua:sync.ok?0:4,nhan:sync.message,mau:sync.ok?"var(--good)":"var(--warn)",treHoc:null,
        chet:bangChet(x.bang||[]),lamMoiTre:false,rawSource:true});
    }
    if(x.kho==="AMIS"){
      const sync=kiemTraDongBoLead(leadThang,!!KQ[TEN_NGUON.indexOf('crm_lead_thang')]?.error,Date.now());
      return Object.assign({},x,{den:sync.day,gio:sync.hours,cua:sync.ok?0:4,nhan:sync.message,mau:sync.ok?"var(--good)":"var(--warn)",treHoc:null,chet:[],lamMoiTre:false,rawSource:true});

    }
    const t=x.kho?tDL[x.kho]:null, gio=t?t.gio:null;
    const chet=bangChet(x.bang||[]);
    // moi nguon co nhip rieng: diem danh/kiem viec theo NGAY HOC, lead/tin nhan/quang cao theo NGAY LICH
    const treHoc = x.den ? ngayHocTuDen(x.den,homNay) : null;
    const treLich= lichNgay(x.den);
    const qua = (x.do==="hoc") ? ((treHoc||0) >= (x.han||1)) : ((treLich||0) > (x.han||1));
    const moTaTre = (x.do==="hoc") ? ((treHoc||0)+" ngày học") : ((treLich||0)+" ngày");
    // file nay ve kho luc nao — de so sanh voi lan lam moi bang tinh san
    const veKho=(t&&t.luc)?new Date(t.luc):null;
    const lamMoiTre = !!(lmLuc && veKho && !isNaN(veKho.getTime()) && lmLuc < veKho);
    let cua=0, nhan="", mau="var(--ink2)";
    if(chet.length){          cua=3; nhan="Máy chủ quá tải — thiếu "+chet.length+"/"+x.bang.length+" bảng"; mau="var(--crit)"; }
    else if(x.tay&&coTuoi){
      if(gio==null)            { cua=1; nhan="Chưa bao giờ được kéo về"; mau="var(--crit)"; }
      else if(gio>30)          { cua=1; nhan="Chưa ai bấm dấu trang — "+doTuoi(gio); mau="var(--crit)"; }
      else if(x.den==null)     { cua=2; nhan=lamMoiTre?"Đã về kho, bảng tính sẵn chưa làm mới":"Đã kéo về, chưa bóc ra số";  mau="var(--warn)"; }
      else if(qua)             { cua=2; nhan=(lamMoiTre?"Đã về kho, bảng tính sẵn chưa làm mới — thiếu ":"Đã kéo về, chờ job bóc số — thiếu ")+moTaTre;  mau="var(--warn)"; }
      else                     { cua=0; nhan="Bình thường"; mau="var(--good)"; }
    }else{
      if(x.den==null)          { cua=2; nhan="Chưa có số nào"; mau="var(--warn)"; }
      else if(qua)             { cua=2; nhan="Job tự động chưa chạy — "+moTaTre; mau="var(--crit)"; }
      else                     { cua=0; nhan="Bình thường"; mau="var(--good)"; }
    }
    return Object.assign({},x,{gio:gio,cua:cua,nhan:nhan,mau:mau,treHoc:treHoc,chet:chet,lamMoiTre:lamMoiTre});
  });

  const skHong = SK.filter(x=>x.cua>0);
  const skCua1 = SK.filter(x=>x.cua===1);
  const skCua2 = SK.filter(x=>x.cua===2);
  const skCua3 = SK.filter(x=>x.cua===3);
  const chetTatCa = [...new Set(SK.reduce((a2,x)=>a2.concat(x.chet||[]),[]))];
  const tomiaSK = SK[0];

  // cau "cach sua" cho the diem danh tre — phu thuoc dang tac o cua nao
  const cachSuaTomia = (tomiaSK.cua===1)
   ? '<b>Đang tắc ở cửa 1 — chưa ai kéo Tomia về.</b> Mở <b>hq.tomia.app</b> → bấm dấu trang '
     +'<b>Kéo Tomia</b> (tự đồng bộ → tự xuất báo cáo → tự đưa lên kho). Số sẽ lên sau job bóc lúc <b>09:00</b> sáng mai, '
     +'hoặc chạy ngay ở GitHub → Actions → <i>Keo du lieu</i> → <b>Run workflow</b>.'
   : (tomiaSK.cua===2)
   ? '<b>Đang tắc ở cửa 2 — file đã về kho ('+doTuoi(tomiaSK.gio)+') nhưng chưa ai bóc thành số.</b> '
     +'Job tự bóc lúc <b>09:00</b> sáng mai. Cần ngay thì vào GitHub → Actions → <i>Keo du lieu</i> → '
     +'<b>Run workflow</b>, chờ ~2 phút rồi bấm <b>↻ Tải lại số</b>.'
   : '<b>Cả hai cửa đều thông.</b> Nếu vẫn thấy số cũ thì là cửa 3 — trình duyệt đang giữ số cũ: bấm <b>↻ Tải lại số</b> ở đầu trang.';

  const skCard =
   '<details class="card"'+(skHong.length?' style="border-color:'+((skCua3.length||skCua1.length)?'var(--crit)':'var(--warn)')+'"':'')+'>'
   +'<summary>'+(skCua3.length?'⛔':(skHong.length?'⚠':'✓'))+' Sức khoẻ dữ liệu — '
   +(skCua3.length? skCua3.length+'/6 nguồn KHÔNG lấy được số' : (skHong.length? skHong.length+'/6 nguồn có vấn đề' : 'cả 6 nguồn bình thường'))+'</summary>'
   +'<p class="sub">Số trên app chỉ mới bằng nguồn cũ nhất. Đọc dòng nào màu đỏ hoặc cam trước.</p>'
   +'<div class="tw"><table style="min-width:620px"><thead><tr><th>Nguồn</th><th>Kéo về kho</th>'
   +'<th>Ngày dữ liệu / mốc tham chiếu</th><th>Tình trạng</th></tr></thead><tbody>'
   + SK.map(x=>'<tr><td>'+x.ten+'</td>'
       +'<td class="mono">'+(x.rawSource?(x.gio==null?"chưa có mốc riêng":doTuoi(x.gio)):x.tay?(coTuoi?doTuoi(x.gio):'<span style="opacity:.5">chưa bật</span>'):'<span style="opacity:.5">tự động</span>')+'</td>'
       +'<td class="mono">'+(x.den||"—")+'</td>'
       +'<td style="color:'+x.mau+'">'+(x.cua===0?"✓ ":(x.cua===1?"⚠ ":(x.cua===3?"⛔ ":"⏳ ")))+x.nhan+'</td></tr>').join("")
   +'</tbody></table></div>'
   +'<p class="note">SUPA: “Bình thường” xác nhận lần đồng bộ còn mới và đã tải được bảng kiểm việc; không xác nhận có phiếu mới mỗi ngày. Ngày kiểm việc mới nhất đang có: '+escNH(maxNg(supa,"ngay")||"chưa có")+'. AMIS: trạng thái trên kiểm tra tổng lead theo tháng. Chi tiết lead theo ngày/phễu là nguồn riêng; trạng thái này không xác nhận phần chi tiết đã đầy đủ.</p>'
   +(chetTatCa.length? '<div class="q" style="border-color:var(--crit)"><b>⛔ Máy chủ không trả kịp '+chetTatCa.length+' bảng:</b> '
       +chetTatCa.map(vietTen).join(" · ")
       +'.<br>Các thẻ dùng những bảng này <b>không hiện trên trang</b> — nghĩa là <b>chưa lấy được</b>, '
       +'<b>không phải</b> là không có việc. Bấm <b>↻ Tải lại số</b> để thử lại; nếu lặp lại nhiều lần thì máy chủ đang quá tải, báo cho Phuong.</div>' : "")
   +(skCua1.length? '<div class="q"><b>Cửa 1 — chưa ai bấm dấu trang:</b> '
       +skCua1.map(x=>x.ten.split(" —")[0]).join(" · ")
       +'. Việc của người trực buổi sáng. Mở trang nguồn, bấm dấu trang tương ứng.</div>' : "")
   +(skCua2.filter(x=>x.lamMoiTre).length?
      '<div class="q"><b>Cửa 2B — số đã bóc xong, nhưng bảng tính sẵn chưa làm mới:</b> '
       +skCua2.filter(x=>x.lamMoiTre).map(x=>x.ten.split(" —")[0]).join(" · ")
       +'.<br>Lần làm mới gần nhất: <b>'+(lmLuc?doTuoi(lmGio):"chưa bao giờ")+'</b> — <b>trước</b> lúc file về kho, nên app vẫn đang đọc số cũ. '
       +'Máy tự làm mới lúc <b>09:10</b> và <b>09:45</b> mỗi sáng. '
       +'<b>Bấm Run workflow trên GitHub KHÔNG sửa được việc này</b> — đó là cửa khác. Báo cho Phuong nếu quá 09:45 vẫn chưa mới.</div>' : "")
   +(skCua2.filter(x=>!x.lamMoiTre).length? '<div class="q"><b>Cửa 2 — đã về kho nhưng chưa bóc thành số:</b> '
       +skCua2.filter(x=>!x.lamMoiTre).map(x=>x.ten.split(" —")[0]).join(" · ")
       +'. Job tự bóc lúc <b>09:00</b> mỗi sáng. Cần ngay: GitHub → Actions → <i>Keo du lieu</i> → <b>Run workflow</b> → chờ ~2 phút → bấm <b>↻ Tải lại số</b>.</div>' : "")
   +'<p class="note" style="margin-top:8px">Bảng tính sẵn làm mới lần cuối: <b class="mono">'
       +(lmLuc? (lmLuc.toISOString().slice(0,16).replace("T"," ")+" UTC · "+doTuoi(lmGio)) : "chưa ghi nhận")+'</b></p>'
   +'<p class="note" style="margin-top:10px">Số của <b>hôm nay ('+homNay+')</b> luôn chưa chốt — điểm danh còn đang diễn ra. '
   +'Chỉ tin số từ <b>ngày học gần nhất trở về trước</b>.</p></details>';
  const treNgay = bdNgay ? ngayHocTuDen(bdNgay,homNay) : null;
  const bangTre = (treNgay!=null && treNgay>=1) ?
   '<details class="card" style="border-color:var(--warn)">'
   +'<summary>⏳ Dữ liệu điểm danh đang trễ — thiếu '+treNgay+' ngày học</summary>'
   +'<p class="sub">Ngày học gần nhất có điểm danh: <b>'+bdNgay+'</b> · hôm nay '+homNay+'</p>'
   +'<p class="leg" style="margin-top:-6px;font-size:13.5px;color:var(--ink2)">Thiếu <b class="down">'+treNgay+' ngày học</b>. '
   +'Các số liệu Tomia về trẻ có mặt, vắng, trẻ nghỉ dài và <b>ngày đầu ghi nhận</b> ở dưới đều <b>đang thiếu '+treNgay+' ngày</b> — '
   +'đó là dữ liệu chưa về, <b>không phải</b> trường tuyển kém hay trẻ nghỉ nhiều.</p>'

let CHE="1", DOM=['tuyensinh','tangtruong','ketnoi','hocsinhnghi','tomia','checklist','channel','nhansu'].includes(new URLSearchParams(location.search).get('mang'))?new URLSearchParams(location.search).get('mang'):null;   // DOM=null: dang o che do doc (1/2/3). DOM!=null: dang o tab mang.
function apDungChe(){
  const dom=!!DOM;
  ["1","2","3"].forEach(z=>{const el=$("z"+z); if(el) el.className="zone"+(!dom&&z===CHE?" on":"")});
  const zd=$("zdom"); if(zd) zd.className="zone"+(dom?" on":"");
  document.querySelectorAll("#che > button").forEach(b=>{b.className=(!dom&&b.dataset.z===CHE?"on":"")});
  document.querySelectorAll("#mang > button").forEach(b=>{b.className=(dom&&b.dataset.dom===DOM?"on":"")});
  document.querySelectorAll("#zdom .dom").forEach(d=>{d.className="dom"+(d.dataset.dom===DOM?" on":"")});
  // o thoi gian chi co nghia khi co the Website/Meta/Google: che do 3, hoac tab Channel/Tuyển sinh
  $("oTG").style.display = ((!dom&&CHE==="3")||DOM==="channel"||DOM==="tangtruong") ? "inline-flex" : "none";
}
$("che").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!b.dataset.z)return;
  CHE=b.dataset.z; DOM=null; apDungChe(); window.scrollTo(0,0);
});
$("mang").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!b.dataset.dom)return;
  DOM=b.dataset.dom; apDungChe(); window.scrollTo(0,0);
});

// b28: tu phat hien ban moi tren server -> hien thanh nhac "Tai lai" (khong ep reload giua chung)
(function(){
  var daNhac="";
  async function kiemTraBanMoi(){
    try{
      var r=await fetch(location.pathname+"?_cb="+Date.now(),{cache:"no-store"});
      if(!r.ok)return;
      var t=await r.text();
      var m=t.match(/BUILD="([^"]+)"/);
      if(!m)return;
      var moi=m[1];
      if(moi===BUILD||moi===daNhac)return;
      daNhac=moi;
      var cu=document.getElementById("__banmoi"); if(cu)cu.remove();
      var b=document.createElement("div"); b.id="__banmoi";
      b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:2147483647;background:var(--accent);color:#fff;padding:10px 16px;font:14px/1.4 system-ui;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.25)";
      var sp=document.createElement("span"); sp.textContent="Có bản mới của app ("+moi+") — bấm để lấy số liệu & giao diện mới nhất.";
      var nut=document.createElement("button"); nut.textContent="Tải lại ngay";
      nut.style.cssText="background:#fff;color:var(--accent);border:0;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer";
      nut.onclick=function(){ location.replace(location.pathname+"?v="+encodeURIComponent(moi)); };
      var x=document.createElement("button"); x.textContent="Để sau";
      x.style.cssText="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 12px;cursor:pointer";
      x.onclick=function(){ b.remove(); };
      b.appendChild(sp); b.appendChild(nut); b.appendChild(x);
      document.body.appendChild(b);
    }catch(e){}
  }
  setTimeout(kiemTraBanMoi,12000);
  setInterval(kiemTraBanMoi,300000);
})();

    if(loai==="chua_lam") return '<div class="sohd-f" data-cn="'+id+'"><div class="sohd-s" style="margin:0">Vì sao chưa làm được? Chọn 1.</div><div class="sohd-opts">'
      +LY_DO.map(([m,t])=>opt("lydo",m,t,st.lydo===m, m==="sai"?"Ví dụ: sự cố đã xử lý từ trước, số liệu sai":"")).join("")+'</div>'
      +'<label>Ghi chú'+(st.lydo==="khac"||st.lydo==="sai"?' (bắt buộc với lựa chọn này)':' (không bắt buộc)')+'<input name="ghichu" value="'+esc(st.ghichu||"")+'"></label>'

  function nhomCua(r){ const t=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===khoa(r.loai_ca,r.ma_ca)); return t?t.nhom_luat:(r.loai_ca==="coc"?"coc_cho":r.loai_ca==="em"?"vang_som":"an_toan"); }
  function docForm(el, st){ if(!el) return; el.querySelectorAll("input[name],textarea[name],select[name]").forEach(i=>{ st[i.name]=i.value; }); }
  async function guiCapNhat(id, btn){
    const st=S.sua[id]; const el=document.querySelector('[data-cn="'+id+'"]'); const msg=document.querySelector('[data-msg="d'+id+'"]'); docForm(el,st);
    const loi = t => { if(msg){ msg.className="sohd-msg err"; msg.textContent=t; } btn.disabled=false; };
    const r=S.so.find(x=>x.id==id); if(!r) return;
    let p=null; const hoTro = st.hotro && st.hotro!=="Không cần" ? " [Cần hỗ trợ: "+st.hotro+"]" : "";
    const gc = (st.ghichu||"").trim();
    if(st.loai==="xong") p={trang_thai:"xong", cau_tra_loi_nguyen_van: gc||null};
    else if(st.loai==="mot_phan"){
      if(!gc) return loi("Ghi ngắn phần đã làm được.");
      const h=new Date(st.han); if(!st.han||isNaN(h)) return loi("Chọn hạn cho phần còn lại.");
      if(h.getTime()<Date.now()) return loi("Hạn mới phải sau bây giờ.");
      p={trang_thai:"mot_phan", han_luc:h.toISOString(), cau_tra_loi_nguyen_van:("Làm được: "+gc+hoTro).slice(0,1000)}; }
    else if(st.loai==="chua_lam"){
      if(!st.lydo) return loi("Chọn 1 lý do.");
      if((st.lydo==="khac"||st.lydo==="sai") && !gc) return loi("Ghi thêm vài chữ cho lựa chọn này.");
      if(st.lydo==="sai") p={trang_thai:"dung", chan_doan_dung:false, nguyen_nhan_that:("Không đúng thực tế: "+gc).slice(0,500), cau_tra_loi_nguyen_van:("Trường hợp không đúng thực tế: "+gc+hoTro).slice(0,1000)};
      else p={trang_thai:"chua_lam", ly_do_khong_lam: st.lydo==="khac"?null:st.lydo, cau_tra_loi_nguyen_van: ((gc||LY_DO_TEN[st.lydo])+hoTro).slice(0,1000)}; }
    else if(st.loai==="doi"){
      const h=new Date(st.han); if(!st.han||isNaN(h)) return loi("Hạn chưa đúng.");
      const ng=(st.nguoi||"").trim().toLowerCase();
      if(ng && !/^[^@\s]+@meschool\.vn$/.test(ng)) return loi("Email người làm phải là @meschool.vn (hoặc để trống).");
      p={han_luc:h.toISOString(), nguoi_nhan:ng||null, vai_tro_nhan:st.vai||r.vai_tro_nhan}; }
    else if(st.loai==="hoan_tac") p={trang_thai:"dung", cau_tra_loi_nguyen_van:"Hoàn tác: nhận nhầm"};
    if(!p) return;
    btn.disabled=true; if(msg){ msg.className="sohd-msg"; msg.textContent="Đang lưu…"; }
    const res = await sb.from("so_hanh_dong").update(p).eq("id",+id).select("id");
    if(res.error||!res.data||!res.data.length) return loi("Chưa cập nhật được"+(res.error?": "+res.error.message:" (không có quyền sửa dòng này)."));
    ghiDau("so_hd_cap_nhat", st.loai+(st.lydo?":"+st.lydo:"")); delete S.sua[id]; S.mo.bar=true; await tai(); }

      +'<label>Ai làm (vai trò)<select name="vai">'+VAI.map(v=>'<option'+(v===c.vai?' selected':'')+'>'+esc(v)+'</option>').join("")+'</select></label>'
      +'<label>Email người làm (để việc hiện trong “Sổ của tôi” của họ)<input name="nguoi" type="email" value="'+esc(c.nguoi)+'" placeholder="ten@meschool.vn"></label>'
      +'<label>Hạn (ngày và giờ)<input name="han" type="datetime-local" value="'+esc(c.han)+'"></label>'
      +'<div class="sohd-btns"><button class="primary" data-sohd="luu" data-k="'+esc(k)+'">'+(giao?"Giao việc":"Nhận việc")+'</button><button data-sohd="chi_tiet" data-k="'+esc(k)+'">Đóng</button></div>'
      +'<div class="sohd-msg'+(c.msgLoi?" err":"")+'" data-msg="'+esc(k)+'">'+esc(c.msg||"")+'</div></div>';
    if(t.mo) b4='<p class="sohd-s">Trường hợp này đã có người nhận (xem dòng “Đã nhận” phía trên). Bạn vẫn có thể ghi thêm một việc khác.</p>'+b4;
    if(daBao) b4='<p class="sohd-s">Bạn đang báo tình trạng ở bước 1. Nếu vẫn cần làm việc gì, điền tiếp dưới đây.</p>'+b4;

  function veChiTiet(k){ const r=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===k); const sl=document.querySelector('[data-slot="'+CSS.escape(k)+'"]'); if(r&&sl) sl.innerHTML=S.ct[k]?htmlChiTiet(r):""; }
  function htmlTH(){

    const csCo=[...new Set(all.map(r=>r.campus_code))].sort((a,b)=>tenCS(a).localeCompare(tenCS(b),"vi"));
    const appCP = (()=>{ try{ return !!document.getElementById("camp").value; }catch(e){ return false; } })();
    const chips = appCP ? '<p class="sohd-s">Đang lọc theo campus chọn ở ô phía trên.</p>'
      : '<div class="sohd-chips"><button data-sohd="cs" data-cs=""'+(ds.length?'':' class="on"')+'>Tất cả</button>'
        +csCo.map(c=>'<button data-sohd="cs" data-cs="'+esc(c)+'"'+(ds.indexOf(c)>=0?' class="on"':'')+'>'+esc(tenCS(c))+'</button>').join("")+'</div>';
    const gap = loc.length > 8;   // nhiều trường hợp (CEO, xem toàn hệ thống) → gập nhóm, xem bảng tóm tắt trước
    const nhom = NHOM.map(([m,ten])=>{ const rr=loc.filter(r=>nhomCa(r)===m); if(!rr.length) return "";
      const chuaNhan=rr.filter(r=>canNhan(trangThaiCa(r))).length;
      const hien = S.mo["nh:"+m] ? rr : rr.slice(0,6);
      const mo = (S.mo["g:"+m]!==undefined) ? S.mo["g:"+m] : !gap;
      return '<details class="sohd-grp" data-nh="'+m+'"'+(mo?' open':'')+'><summary>'+esc(ten)+' — '+rr.length+(chuaNhan?' · <span style="color:var(--crit,#A93126)">'+chuaNhan+' chưa ai nhận</span>':'')+'</summary>'
        +hien.map(htmlCa).join("")
        +(rr.length>hien.length?'<div class="sohd-btns"><button data-sohd="them" data-nh="'+m+'">Xem thêm '+(rr.length-hien.length)+'</button></div>':'')+'</details>'; }).join("");
    return '<div class="card" id="sohd-th"><h2>Trường hợp cần xử lý</h2>'
      +'<p class="sub">Máy đọc số liệu → gợi ý nguyên nhân → gợi ý việc làm. <b>Nhận việc</b> để ghi vào sổ của bạn, hoặc <b>Xem chi tiết</b> để kiểm tình trạng thật, sửa nguyên nhân, đổi việc, giao cho người khác. Thư viện đang là bản nháp, chưa qua buổi duyệt.</p>'
      +chips
      +htmlTomTat(loc)
      +(S.loi?'<p class="note">Chưa đọc đủ dữ liệu thư viện: '+esc(S.loi)+'</p>':'')
      +(nhom || '<p class="sohd-s">Không có trường hợp nào'+(ds.length?' ở campus đang chọn':'')+'. Máy đang xét 3 loại: sự cố nghiêm trọng còn mở, bé mới vắng 3 buổi liền trở lên, đặt cọc quá 21 ngày chưa đi học.</p>')
      +'</div>'; }

  // ---------- BẢNG TÓM TẮT THEO CAMPUS (khi đang xem từ 2 campus trở lên) ----------
  function htmlTomTat(loc){
    const cs=[...new Set(loc.map(r=>r.campus_code))]; if(cs.length<2) return "";
    const now=Date.now();
    const dong = cs.map(c=>{ const rr=loc.filter(r=>r.campus_code===c); let chua=0, nhan=0, qua=0, gap24=0;
      rr.forEach(r=>{ const t=trangThaiCa(r); if(canNhan(t)){ chua++; if(r.muc==="24h") gap24++; } if(t.mo){ nhan++; if(new Date(t.mo.han_luc).getTime()<now) qua++; } });
      return {c, n:rr.length, chua, nhan, qua, gap24}; })
      .sort((a,b)=>b.gap24-a.gap24 || b.chua-a.chua || b.n-a.n || tenCS(a.c).localeCompare(tenCS(b.c),"vi"));
    const tong = k => dong.reduce((s,x)=>s+x[k],0);
    return '<table class="sohd-tt"><caption class="sohd-s" style="text-align:left;caption-side:top;margin-bottom:2px">Tóm tắt theo campus — chạm tên campus để xem chi tiết. <span class="do">●</span> = có việc 24 giờ chưa ai nhận.</caption>'
      +'<thead><tr><th scope="col">Campus</th><th scope="col">Cần xử lý</th><th scope="col">Chưa ai nhận</th><th scope="col">Đã nhận</th><th scope="col">Quá hạn</th></tr></thead><tbody>'
      +dong.map(x=>'<tr><td><button data-sohd="cs1" data-cs="'+esc(x.c)+'">'+(x.gap24?'<span class="do" aria-label="có việc 24 giờ chưa ai nhận">● </span>':'')+esc(tenCS(x.c))+'</button></td>'
        +'<td>'+x.n+'</td><td'+(x.chua?' class="do"':'')+'>'+x.chua+'</td><td>'+x.nhan+'</td><td'+(x.qua?' class="do"':'')+'>'+x.qua+'</td></tr>').join("")
      +'<tr><td style="padding:10px 4px;font-weight:700">Tổng</td><td><b>'+tong("n")+'</b></td><td><b>'+tong("chua")+'</b></td><td><b>'+tong("nhan")+'</b></td><td><b>'+tong("qua")+'</b></td></tr>'
      +'</tbody></table>'; }

  // ---------- THẺ "SỔ HÀNH ĐỘNG — 14 NGÀY" (chế độ ②) ----------
  function htmlKL(){
    if(!S.kl.length) return '<div class="card" id="sohd-kl"><h2>Sổ hành động — 14 ngày qua</h2><p class="sub">Chưa có việc nào trong sổ. Khi đội bắt đầu ghi, bảng này cho thấy việc có làm đúng hẹn không, theo campus và vai trò — không xếp hạng từng người.</p></div>';
    const by={}; S.kl.forEach(r=>{ (by[r.campus_code]=by[r.campus_code]||[]).push(r); });
    const n=k=>Object.values(by).flat().reduce((s,r)=>s+(+r[k]||0),0);
    return '<div class="card" id="sohd-kl"><h2>Sổ hành động — 14 ngày qua</h2>'
      +'<p class="sub">'+n("tong")+' việc · '+n("xong")+' xong ('+n("xong_dung_han")+' đúng hạn) · '+n("mot_phan")+' đang làm dở · '+n("qua_han_dang_mo")+' quá hạn chưa đóng · '+n("chua_lam")+' chưa làm được'
        +(n("may_doan_sai")?' · máy đoán sai nguyên nhân '+n("may_doan_sai")+' lần':'')+'</p>'
      +Object.keys(by).sort((a,b)=>tenCS(a).localeCompare(tenCS(b),"vi")).map(c=>'<div class="sohd-item"><div class="sohd-t">'+esc(tenCS(c))+'</div>'
        +by[c].map(r=>'<div class="sohd-s">'+esc(r.vai_tro_nhan)+': '+r.tong+' việc · '+r.xong+' xong ('+r.xong_dung_han+' đúng hạn) · '+(+r.mot_phan||0)+' làm dở · '+r.qua_han_dang_mo+' quá hạn · '+r.chua_lam+' chưa làm được'
          +(+r.co_ly_do_khong_lam?' ('+r.co_ly_do_khong_lam+' có ghi lý do)':'')+'</div>').join("")+'</div>').join("")
      +'<p class="leg">Việc đã xong có giải quyết được trường hợp không (đo lại sau 7, 14, 28 ngày) sẽ hiện ở bước sau, khi sổ đủ dữ liệu.</p></div>'; }

  // ---------- GẮN VÀO TRANG (không sửa thẻ cũ) ----------
  function ve(){
    try{
      if(S.tat || !S.th) return;
      const body=document.getElementById("body"), z1=document.getElementById("z1"), z2=document.getElementById("z2");
      if(!body||!z1) return;
      dangVe=true;
      const thay=(id,html,cha,truoc)=>{ const cu=document.getElementById(id); const t=document.createElement("div"); t.innerHTML=html; const moi=t.firstElementChild;
        if(cu) cu.replaceWith(moi); else if(truoc) cha.insertBefore(moi,truoc); else cha.appendChild(moi); };
      thay("sohd-bar",htmlBar(),body,body.firstChild);
      const sub=z1.querySelector(":scope > p.sub"); thay("sohd-th",htmlTH(),z1,sub?sub.nextSibling:z1.firstChild);
      if(z2){ const sub2=z2.querySelector(":scope > p.sub"); thay("sohd-kl",htmlKL(),z2,sub2?sub2.nextSibling:z2.firstChild); }
    }catch(e){ try{ console.warn("sohd ve",e); }catch(_){} }
    finally{ dangVe=false; }
  }
  let toastHen=null;
  function toast(html){ try{ let el=document.getElementById("sohd-toast"); if(!el){ el=document.createElement("div"); el.id="sohd-toast"; el.className="sohd-toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
    el.innerHTML=html; el.style.display="flex"; clearTimeout(toastHen); toastHen=setTimeout(()=>{ el.style.display="none"; },6000); }catch(e){} }
  function dongMoi(r, o){
    const snap=Object.assign({luc:new Date().toISOString()},r); delete snap.ten_hien_thi;   // sổ chỉ giữ MÃ, không giữ tên trẻ
    return Object.assign({ loai_ca:r.loai_ca, ma_ca:r.ma_ca, campus_code:r.campus_code||"?", chang_phieu:r.chang_phieu||null,
      ma_luat:r.ma_goc||null, anh_chup_bang_chung:snap, nguon_du_lieu_tuoi:{canh_bao:r.canh_bao_du_lieu||null, ket_qua:r.ket_qua||null},
      ma_goc_goi_y:r.ma_goc||null, phien_ban:"v1-nhap", hanh_dong_chinh:true }, o); }
  async function nhan1(k, btn){   // Nhận việc 1 chạm: mặc định từ thư viện, người làm = mình
    const r=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===k); if(!r) return;
    const hd=hdTheoGoc(r,null); if(!hd) return;
    btn.disabled=true;
    const row=dongMoi(r,{ ma_hanh_dong:(hd.ma&&S.hd[hd.ma])?hd.ma:null, hanh_dong_text:hoa(vietDu(hd.ten)),
      vai_tro_nhan:vaiGoiY(hd.owner_role), nguoi_nhan:S.email||null, han_luc:new Date(hanMacDinh(r.muc)).toISOString(),
      chi_so_do:DAU_VET[r.nhom_luat]||"Trường hợp được giải quyết", muc_dich:hd.co_che||null });
    const res=await sb.from("so_hanh_dong").insert(row).select("id");
    if(res.error||!res.data||!res.data.length){ btn.disabled=false; toast('<span style="flex:1">Chưa nhận được việc: '+esc(res.error?res.error.message:"không có quyền")+'</span>'); return; }
    const id=res.data[0].id;
    ghiDau("so_hd_nhan_1cham", r.nhom_luat);
    toast('<span style="flex:1">Đã ghi vào sổ của bạn. Hạn '+esc(gio(row.han_luc))+'.</span><button data-sohd="hoan_tac_ngay" data-id="'+id+'">Hoàn tác</button>');
    S.mo.bar=false; await tai(); }
  async function luuCT(k, btn){
    const r=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===k); const c=S.ct[k]; if(!r||!c) return;
    docForm(document.querySelector('[data-ct="'+CSS.escape(k)+'"]'), c);
    const loi = t => { c.msg=t; c.msgLoi=true; const m=document.querySelector('[data-msg="'+CSS.escape(k)+'"]'); if(m){ m.className="sohd-msg err"; m.textContent=t; } btn.disabled=false; };
    const an=r.nhom_luat==="an_toan";
    const gocChon = an ? null : (c.dung===false ? (c.goc==="khac"?null:c.goc) : gocGoiY(r));
    if(!an && c.dung===false && !c.goc) return loi("Chọn nguyên nhân đúng hơn ở bước 2 (hoặc chọn “Chưa chắc”).");
    if(!an && c.dung===false && c.goc==="khac" && !(c.gocKhac||"").trim()) return loi("Ghi nguyên nhân bạn thấy ở bước 2.");
    const hd = an ? hdAnToan(r) : (c.dung===false && c.goc==="khac" ? null : hdTheoGoc(r, gocChon));
    const viec = (c.hdKhac||!hd) ? (c.viec||"").trim() : hoa(vietDu(hd.ten));
    if(!viec) return loi("Ghi việc sẽ làm ở bước 3.");
    const nguoi=(c.nguoi||"").trim().toLowerCase();
    if(nguoi && !/^[^@\s]+@meschool\.vn$/.test(nguoi)) return loi("Email người làm phải là @meschool.vn (hoặc để trống).");
    const hanD=new Date(c.han); if(!c.han||isNaN(hanD)) return loi("Hạn chưa đúng.");
    if(hanD.getTime()<Date.now()-60e3) return loi("Hạn phải sau bây giờ.");
    btn.disabled=true; const m=document.querySelector('[data-msg="'+CSS.escape(k)+'"]'); if(m){ m.className="sohd-msg"; m.textContent="Đang lưu…"; }
    const chinh = dongMoi(r,{
      ma_goc_xac_nhan: an?null:(c.dung===true?gocGoiY(r):(c.dung===false?gocChon:null)),
      chan_doan_dung: an?null:c.dung, nguyen_nhan_that: (!an&&c.dung===false&&c.goc==="khac")?(c.gocKhac||"").trim().slice(0,500):null,
      ma_hanh_dong: (!c.hdKhac && hd && hd.ma && S.hd[hd.ma]) ? hd.ma : null,
      hanh_dong_text: viec.slice(0,1000), vai_tro_nhan: c.vai||"Giám đốc cơ sở", nguoi_nhan: nguoi||null,
      han_luc: hanD.toISOString(), chi_so_do: DAU_VET[r.nhom_luat]||"Trường hợp được giải quyết", muc_dich: hd&&hd.co_che||null });
    const rows=[chinh];
    if(an && c.baoPH && r.muc!=="don_so"){ const ph=S.hd["H-B2.3"];
      rows.push(dongMoi(r,{ ma_hanh_dong:ph?"H-B2.3":null, hanh_dong_text:ph?hoa(vietDu(ph.ten)):"Báo rõ với phụ huynh trong 24 giờ",
        vai_tro_nhan:c.vai||"Giám đốc cơ sở", nguoi_nhan:nguoi||null, han_luc:hanD.toISOString(), chi_so_do:"Đã báo phụ huynh (người làm đánh dấu)", hanh_dong_chinh:false })); }
    const res=await sb.from("so_hanh_dong").insert(rows).select("id");
    if(res.error||!res.data||!res.data.length) return loi("Chưa lưu được: "+(res.error?res.error.message:"không có quyền"));
    ghiDau("so_hd_luu_chi_tiet", r.nhom_luat+":"+(an?"an_toan":c.dung===true?"dung":c.dung===false?"sua_nguyen_nhan":"chua_chac"));
    delete S.ct[k]; toast('<span style="flex:1">'+(nguoi&&nguoi!==S.email?"Đã giao việc cho "+esc(nguoi)+".":"Đã ghi vào sổ của bạn.")+' Hạn '+esc(gio(chinh.han_luc))+'.</span>');
    await tai(); }
  async function guiXM(k, btn){
    const r=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===k); const c=S.ct[k]; if(!r||!c||!c.xm) return;
    docForm(document.querySelector('[data-ct="'+CSS.escape(k)+'"]'), c);
    btn.disabled=true;
    const res=await sb.from("xac_minh_ca").insert({loai_ca:r.loai_ca, ma_ca:r.ma_ca, campus_code:r.campus_code||"?", ket_luan:c.xm, ghi_chu:(c.xmGhi||"").trim().slice(0,500)||null}).select("id");
    if(res.error){ btn.disabled=false; toast('<span style="flex:1">Chưa báo được: '+esc(res.error.message)+'</span>'); return; }
    ghiDau("so_hd_xac_minh", c.xm); delete S.ct[k]; toast('<span style="flex:1">Đã ghi tình trạng: '+esc(XM_TEN[c.xm]||c.xm)+'. Trường hợp hết khi số liệu mới về.</span>'); await tai(); }

  document.addEventListener("click", async e=>{
    const b=e.target.closest("[data-sohd]"); if(!b) return;
    try{
      const a=b.dataset.sohd, k=b.dataset.k, id=b.dataset.id;
      if(a==="nhan"){ await nhan1(k,b); }
      else if(a==="chi_tiet"){ const r=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===k); if(!r) return;
        if(S.ct[k]){ delete S.ct[k]; } else { S.ct[k]=ctMacDinh(r); ghiDau("so_hd_chi_tiet", r.nhom_luat); }
        const it=b.closest(".sohd-item"); if(it){ const t=document.createElement("div"); t.innerHTML=htmlCa(r); it.replaceWith(t.firstElementChild); } }
      else if(a==="chon"){
        const ct=b.closest("[data-ct]"), cn=b.closest("[data-cn]"), nhom=b.dataset.nhom, v=b.dataset.v;
        if(ct){ const kk=ct.dataset.ct, c=S.ct[kk]; if(!c) return; docForm(ct,c);
          if(nhom==="xm") c.xm=v;
          else if(nhom==="dung"){ c.dung = v==="co"?true:v==="khong"?false:null; if(c.dung!==false){ c.goc=null; } ghiDau("so_hd_nguyen_nhan",v); }
          else if(nhom==="goc"){ c.goc=v; const r=(S.th||[]).find(x=>khoa(x.loai_ca,x.ma_ca)===kk); const hd=r&&hdTheoGoc(r,v==="khac"?null:v); if(hd&&v!=="khac") c.vai=vaiGoiY(hd.owner_role); }
          else if(nhom==="hd") c.hdKhac=false;
          else if(nhom==="hdk") c.hdKhac=!c.hdKhac;
          else if(nhom==="baoPH") c.baoPH=!c.baoPH;
          c.msg=""; veChiTiet(kk); }
        else if(cn){ const ii=cn.dataset.cn, st=S.sua[ii]; if(!st) return; docForm(cn,st); st[nhom]=v; const sl=document.querySelector('[data-slot="'+ii+'"]'); if(sl) sl.innerHTML=htmlCapNhat(ii,st); } }
      else if(a==="luu"){ await luuCT(k,b); }
      else if(a==="gui_xm"){ await guiXM(k,b); }
      else if(a==="xac_nhan"){ b.disabled=true; const res=await sb.from("so_hanh_dong").update({xac_nhan_luc:new Date().toISOString()}).eq("id",+id).select("id");
        if(res.error||!res.data||!res.data.length){ b.disabled=false; toast('<span style="flex:1">Chưa nhận được: '+esc(res.error?res.error.message:"không có quyền")+'</span>'); return; }
        ghiDau("so_hd_xac_nhan","1"); toast('<span style="flex:1">Đã nhận việc. Người giao sẽ thấy “Đã nhận”.</span>'); S.mo.bar=true; await tai(); }
      else if(a==="cs1"){ luuCS([b.dataset.cs]); ghiDau("so_hd_tom_tat_cs", b.dataset.cs); ve(); const th=document.getElementById("sohd-th"); if(th) th.scrollIntoView({block:"start"}); }
      else if(a==="cs"){ const c=b.dataset.cs; let ds=chonCS(); ds = !c ? [] : (ds.indexOf(c)>=0 ? ds.filter(x=>x!==c) : ds.concat([c])); luuCS(ds); ve(); }
      else if(a==="them"){ S.mo["nh:"+b.dataset.nh]=true; ve(); }
      else if(["xong","mot_phan","chua_lam","doi","hoan_tac"].indexOf(a)>=0){ S.mo.bar=true; S.sua[id]={loai:a}; const sl=document.querySelector('[data-slot="'+id+'"]'); if(sl) sl.innerHTML=htmlCapNhat(id,S.sua[id]); }
      else if(a==="huy_cn"){ delete S.sua[id]; const sl=document.querySelector('[data-slot="'+id+'"]'); if(sl) sl.innerHTML=""; }
      else if(a==="gui_cn"){ await guiCapNhat(id,b); }
      else if(a==="hoan_tac_ngay"){ b.disabled=true; const res=await sb.from("so_hanh_dong").update({trang_thai:"dung", cau_tra_loi_nguyen_van:"Hoàn tác: nhận nhầm"}).eq("id",+id).select("id");
        if(res.error||!res.data||!res.data.length){ b.disabled=false; return; } ghiDau("so_hd_cap_nhat","hoan_tac"); toast('<span style="flex:1">Đã bỏ nhận việc.</span>'); await tai(); }
    }catch(err){ try{ console.warn("sohd click",err); }catch(_){} }
  });
  document.addEventListener("input", e=>{ // giữ chữ đang gõ khi khối vẽ lại
    try{ const i=e.target; if(!i||!i.name) return; const ct=i.closest&&i.closest("[data-ct]"); if(ct&&S.ct[ct.dataset.ct]) S.ct[ct.dataset.ct][i.name]=i.value;
      const cn=i.closest&&i.closest("[data-cn]"); if(cn&&S.sua[cn.dataset.cn]) S.sua[cn.dataset.cn][i.name]=i.value; }catch(_){} }, true);
  document.addEventListener("change", e=>{ try{ const i=e.target; if(!i||!i.name) return; const ct=i.closest&&i.closest("[data-ct]"); if(ct&&S.ct[ct.dataset.ct]){ S.ct[ct.dataset.ct][i.name]=i.value;
      if(i.name==="nguoi"){ const kk=ct.dataset.ct, bt=ct.querySelector('[data-sohd="luu"]'); if(bt) bt.textContent=(i.value.trim()&&i.value.trim().toLowerCase()!==S.email)?"Giao việc":"Nhận việc"; } }
      const cn=i.closest&&i.closest("[data-cn]"); if(cn&&S.sua[cn.dataset.cn]) S.sua[cn.dataset.cn][i.name]=i.value; }catch(_){} }, true);
  document.addEventListener("toggle", e=>{ if(e.target&&e.target.id==="sohd-bar") S.mo.bar=e.target.open; }, true);
  // nhớ nhóm người dùng tự mở/gập (bấm vào tiêu đề nhóm), không nhớ trạng thái mặc định
  document.addEventListener("click", e=>{ try{ const sm=e.target.closest&&e.target.closest(".sohd-grp > summary"); if(!sm) return;
    const d=sm.parentElement; S.mo["g:"+d.dataset.nh]=!d.open; }catch(_){} }, true);
  // b94: nút "lên đầu trang" trên điện thoại (thanh trên cùng không còn dính khi cuộn)
  try{ const len=document.createElement("button"); len.className="sohd-len"; len.id="sohd-len"; len.type="button";
    len.setAttribute("aria-label","Lên đầu trang: đổi chế độ, campus"); len.textContent="↑"; document.body.appendChild(len);
    len.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
    const mq=window.matchMedia("(max-width:620px)");
    const capNhat=()=>{ len.style.display = (mq.matches && window.scrollY>600) ? "flex" : "none"; };
    window.addEventListener("scroll",capNhat,{passive:true}); capNhat(); }catch(e){}

  // App dựng lại #body mỗi khi đổi campus/khoảng thời gian → gắn lại khối này (không gọi lại máy chủ)
  const theoDoi = () => {
    const body=document.getElementById("body"); if(!body) return;
    new MutationObserver(()=>{ if(dangVe||S.tat) return;
      if(document.getElementById("z1") && (!document.getElementById("sohd-th") || !document.getElementById("sohd-bar"))){
        if(S.th) ve(); else tai(); }
    }).observe(body,{childList:true});
    const lai=document.getElementById("lai"); if(lai) lai.addEventListener("click",()=>setTimeout(tai,1500));
  };
  try{ theoDoi(); if(document.getElementById("z1")) tai(); }catch(e){}
  window.__SOHD = { tai, S };
})();
</script>
