<style>
:root{--bg:#F4F6F5;--surface:#fff;--sunk:#EDF1EF;--line:#DCE3E0;--ink:#141D1B;--ink2:#42514E;
--muted:#6E7D79;--accent:#0F5348;--soft:#E1EEE9;--good:#4F7A1E;--warn:#A96C05;--crit:#A93126;
--shadow:0 1px 2px rgba(20,29,27,.06),0 6px 20px -12px rgba(20,29,27,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0D1210;--surface:#151D1B;--sunk:#1D2724;--line:#2A3633;
--ink:#E7EDEA;--ink2:#B4C1BD;--muted:#8B9995;--accent:#4EB69D;--soft:#173029;--good:#8DBE4E;
--warn:#DFA648;--crit:#E2776A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;

.brand{display:flex;align-items:center;gap:9px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}

letter-spacing:.06em;text-transform:uppercase}

select,button{font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;
box-shadow:var(--shadow);margin-top:14px}

.up{color:var(--good)}.down{color:var(--crit)}.flat{color:var(--muted)}

.leg{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5}

table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}

font-weight:500;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}

.q{font-size:13.5px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:11px 13px;margin-top:13px}

border-radius:0 10px 10px 0;padding:12px 14px;margin-top:13px}

/* login */

background:var(--surface);color:var(--ink);margin-bottom:10px;text-align:center}

@media(prefers-color-scheme:dark){.msg.err{background:#2E1815}}
.chart{width:100%;height:auto;display:block}
.hidden{display:none}
</style></head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL_="https://fxxgfihjirxbfmhwarkl.supabase.co";
const KEY_="sb_publishable_nDc9MwY0OHuWCBXhc7XqqQ_4_kRsR-T";
const sb=supabase.createClient(URL_,KEY_);
const $=id=>document.getElementById(id);
const fmt=n=>n==null||isNaN(n)?"—":Math.round(n).toLocaleString("vi-VN");
const vnd=n=>{if(n==null||isNaN(n))return "—";const k=n/1000;
 return (Math.abs(k)<10? k.toFixed(1).replace(".",",") : Math.round(k).toLocaleString("vi-VN"))+" ng";};
const pct=(n,d=1)=>n==null||!isFinite(n)?"—":(n*100).toFixed(d).replace(".",",")+"%";
const dec=(n,d=1)=>n==null||!isFinite(n)?"—":(+n).toFixed(d).replace(".",",");
const shift=(iso,d)=>{const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10)};

$("send").onclick=async()=>{
  const email=$("email").value.trim();
  if(!email){$("msg").className="msg err";$("msg").textContent="Chưa nhập email.";return}
  $("send").disabled=true;$("send").textContent="Đang gửi…";
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("#")[0]}});
  $("send").disabled=false;$("send").textContent="Gửi link đăng nhập";
  if(error){$("msg").className="msg err";$("msg").textContent="Lỗi: "+error.message}
  else{$("msg").className="msg ok";$("msg").textContent="Đã gửi. Mở email và bấm vào link — link dùng được một lần."}
};
$("email").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("period").onchange=render;
$("camp").onchange=render;

function spark(series){
  if(!series.length) return '<div class="note">Không có dữ liệu trong khoảng này</div>';
  const w=560,h=62,p=3,max=Math.max(...series.map(x=>x.v),1);
  const X=i=>p+i*(w-2*p)/Math.max(series.length-1,1), Y=v=>h-p-(v/max)*(h-2*p-8);
  const pts=series.map((x,i)=>X(i).toFixed(1)+","+Y(x.v).toFixed(1)).join(" ");
  const last=series[series.length-1];
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Xu hướng theo ngày">'
   +'<polygon points="'+p+','+(h-p)+' '+pts+' '+X(series.length-1).toFixed(1)+','+(h-p)+'" fill="var(--accent)" opacity=".13"></polygon>'
   +'<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>'
   +'<circle cx="'+X(series.length-1).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="3.4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"></circle></svg>'
   +'<div class="note" style="border:0;padding:0;margin-top:7px;display:flex;justify-content:space-between">'
   +'<span>'+series[0].d.slice(8)+"/"+series[0].d.slice(5,7)+'</span><span>đỉnh <b class="mono">'+fmt(max)+'</b> · gần nhất <b class="mono">'+fmt(last.v)+'</b></span></div>';
}
function delta(cur,prev,goodUp=true){
  if(prev==null||prev===0) return '<div class="d">kỳ trước —</div>';
  const r=(cur-prev)/Math.abs(prev);
  const cls=Math.abs(r)<0.02?"flat":(r>0)===goodUp?"up":"down";
  const a=Math.abs(r)<0.02?"→":r>0?"↑":"↓";
  return '<div class="d"><span class="'+cls+'">'+a+" "+(Math.abs(r)*100).toFixed(0)+'%</span> <span style="opacity:.7">vs '+fmt(prev)+"</span></div>";
}
const kpi=(l,v,d,h)=>'<div class="kpi"><div class="l">'+l+'</div><div class="v mono">'+v+"</div>"+(d||"")
 +(h?'<div class="hint">'+h+"</div>":"")+"</div>";

async function render(){
  const n=+$("period").value;
  const CP=$("camp").value||"";            // "" = toan he thong
  const hopCP=(c)=>!CP||String(c||"")===CP; // dong nay co thuoc campus dang chon khong
  $("body").innerHTML='<div class="card"><p class="sub">Đang tải…</p></div>';
  const [{data:ga},{data:gs},{data:gqAll},{data:mt},{data:mc},{data:gpAll},{data:ev},{data:lp},{data:wc},{data:hs},{data:tsi},{data:dd},{data:ddT},{data:wTong},{data:tw},{data:ct},{data:lyDo},{data:coh},{data:viec},{data:ds}] = await Promise.all([
    sb.from("ga4_daily_channel").select("day,channel,sessions,active_users").order("day"),
    sb.from("gsc_daily").select("day,clicks,impressions,ctr,position").order("day"),
    sb.from("gsc_query").select("snapshot_on,query,clicks,impressions,ctr,position").order("snapshot_on",{ascending:false}).order("impressions",{ascending:false}).limit(1200),
    sb.from("meta_ad_daily").select("day,account_name,spend,impressions,reach,clicks").order("day"),
    sb.from("meta_campaign_daily").select("day,account_name,campaign_name,objective,spend,impressions,reach,clicks,link_clicks,results,result_type").order("day"),
    sb.from("gsc_page").select("snapshot_on,page,clicks,impressions,ctr,position").order("snapshot_on",{ascending:false}).order("clicks",{ascending:false}).limit(1200),
    sb.from("v_web_su_kien").select("cua_so,event_name,so_lan,nguoi").limit(500),
    sb.from("v_web_trang").select("cua_so,landing_page,phien,gan_ket,giay_tong,su_kien").limit(500),
    sb.from("web_click").select("ts,kind,page,ref").order("ts",{ascending:false}).limit(20000),
    sb.from("v_siso").select("nhom,campus,so_hs,so_lop").limit(2000),
    sb.from("v_lead_campus").select("ngay,campus,giai_doan,nguon,so_lead").limit(2000),
    sb.from("v_diem_danh").select("ngay,campus,di_hoc,vang,dan_thuoc").order("ngay",{ascending:false}).limit(2000),
    sb.from("v_siso").select("nhom,campus,so_hs").limit(1),
    sb.from("v_web_tong").select("cua_so,su_kien,phien").limit(10),
    sb.from("v_tuan_campus").select("tuan,campus,cuoc_goi,lead_moi,hen,da_tham_quan,dat_coc,da_di_hoc").order("tuan",{ascending:false}).limit(2000),
    sb.from("chi_tieu").select("campus,thang,tuyen_moi,si_so_kh").limit(500),
    sb.from("v_can_ly_do").select("campus,ten,giai_doan,so_ngay_im_lang,ly_do,ngay_doi").order("so_ngay_im_lang",{ascending:false}).limit(1000),
    sb.from("v_cohort_tuan").select("tuan_tao,campus,lead,cham_24h,cham_2_lan_tro_len,chua_ai_cham,hen_tham,coc_chot,tu_choi,im_lang_14").limit(500),
    (CP? sb.from("v_viec_tuan").select("ro,campus,ten,giai_doan,kenh,ngay_tao,im_lang,so_cham").eq("campus",CP).not("ro","is",null).order("im_lang",{ascending:false}).limit(1000)
       : sb.from("v_viec_tuan").select("ro,campus,ten,giai_doan,kenh,ngay_tao,im_lang,so_cham").not("ro","is",null).order("im_lang",{ascending:false}).limit(1000)),
    (CP? sb.from("v_danh_sach").select("tang,campus,ten,kenh,giai_doan,ngay_tao,im_lang,so_cham,goi_nghe_may,goi_khong_nghe,cham_cuoi_ngay,cham_cuoi_ai,cham_cuoi_lam_gi,cham_cuoi_ket_qua,cham_cuoi_ghi_chu").eq("campus",CP).order("im_lang",{ascending:false}).limit(1000)
       : sb.from("v_danh_sach").select("tang,campus,ten,kenh,giai_doan,ngay_tao,im_lang,so_cham,goi_nghe_may,goi_khong_nghe,cham_cuoi_ngay,cham_cuoi_ai,cham_cuoi_lam_gi,cham_cuoi_ket_qua,cham_cuoi_ghi_chu").order("im_lang",{ascending:false}).limit(1000))
  ]);
  // chi lay ban chup moi nhat — cac ban chup cu de danh so sanh sau
  const newest=(rows,f)=>{if(!rows||!rows.length)return[];const m=rows.reduce((a,r)=>r[f]>a?r[f]:a,rows[0][f]);return rows.filter(r=>r[f]===m)};
  const gq=newest(gqAll,"snapshot_on"), gp=newest(gpAll,"snapshot_on");
  if(!ga||!gs){$("body").innerHTML='<div class="card"><h2>Không đọc được dữ liệu</h2><p class="sub">Tài khoản chưa được cấp quyền xem.</p></div>';return}

  // nap danh sach campus vao o chon, chi lam mot lan
  if($("camp").options.length<2){
    const ds=new Set();
    (hs||[]).forEach(r=>{if(r.campus&&r.campus!=="(chưa gán campus)")ds.add(r.campus)});
    (dd||[]).forEach(r=>{if(r.campus&&r.campus!=="(chưa rõ)")ds.add(r.campus)});
    (tsi||[]).forEach(r=>{if(r.campus&&r.campus!=="(chưa rõ)"&&r.campus!=="TRUNG TÂM")ds.add(r.campus)});
    [...ds].sort().forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;$("camp").appendChild(o)});
  }
  const nhanCP = CP ? CP : "toàn hệ thống";
  const moGap = CP ? '<details><summary style="cursor:pointer;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;font-weight:600">Xem dữ liệu toàn hệ thống — Website · Meta · Google (không tách được theo campus)</summary><div style="margin-top:14px">' : "";
  const dongGap = CP ? "</div></details>" : "";
  const luuY = "";

  const days=[...new Set(ga.map(r=>r.day))].sort();
  const end=days[days.length-1], start=shift(end,-(n-1)), pEnd=shift(start,-1), pStart=shift(pEnd,-(n-1));
  const inR=(d,a,b)=>d>=a&&d<=b;
  const sum=(rows,f,a,b)=>(rows||[]).filter(r=>inR(r.day,a,b)).reduce((s,r)=>s+(+r[f]||0),0);

  const ses=sum(ga,"sessions",start,end), pses=sum(ga,"sessions",pStart,pEnd);
  const usr=sum(ga,"active_users",start,end), pusr=sum(ga,"active_users",pStart,pEnd);
  const cl=sum(gs,"clicks",start,end), pcl=sum(gs,"clicks",pStart,pEnd);
  const im=sum(gs,"impressions",start,end), pim=sum(gs,"impressions",pStart,pEnd);

  const byDay={}; days.filter(d=>inR(d,start,end)).forEach(d=>byDay[d]=0);
  ga.forEach(r=>{if(byDay[r.day]!==undefined)byDay[r.day]+=(+r.sessions||0)});
  const series=Object.keys(byDay).sort().map(d=>({d,v:byDay[d]}));

  const ch={}; ga.filter(r=>inR(r.day,start,end)).forEach(r=>ch[r.channel]=(ch[r.channel]||0)+(+r.sessions||0));
  const chRows=Object.entries(ch).sort((a,b)=>b[1]-a[1]); const chTot=chRows.reduce((s,x)=>s+x[1],0)||1;
  const paidSes=ga.filter(r=>inR(r.day,start,end)&&/paid/i.test(r.channel)).reduce((s,r)=>s+(+r.sessions||0),0);

  const brand=gq.filter(q=>/me\s*school/i.test(q.query));
  const brandCl=brand.reduce((s,q)=>s+(+q.clicks||0),0);
  const allCl=gq.reduce((s,q)=>s+(+q.clicks||0),0);

  // ----- SU KIEN WEBSITE: website co cho phu huynh gio tay khong? -----
  const RAISE=/form|submit|lead|contact|phone|hotline|tel|zalo|messeng|chat|call|dang.?ky|register|booking|dat.?lich|tu.?van/i;
  const NOTRAISE=/form_start|^click$|^send$|select_content/i;
  const isRaise=k=>RAISE.test(k)&&!NOTRAISE.test(k);
  const evAgg={}; (ev||[]).filter(r=>+r.cua_so===n).forEach(r=>{
    const k=r.event_name; evAgg[k]={c:+r.so_lan||0,u:+r.nguoi||0}});
  const evRows=Object.entries(evAgg).sort((a,b)=>b[1].c-a[1].c);
  const raiseAll=evRows.filter(([k])=>isRaise(k));
  const suspect=raiseAll.filter(([k,v])=>ses&&v.c/ses>0.03);
  const raiseRows=raiseAll.filter(x=>suspect.indexOf(x)<0);
  const raiseTot=raiseRows.reduce((s,x)=>s+x[1].c,0);

  // ----- GAN LEN TOP: tu khoa vi tri 8-20, con nhieu cho de len -----
  const ctrAt=p=>p<=1.5?.28:p<=2.5?.15:p<=3.5?.11:p<=4.5?.085:p<=5.5?.065:p<=10?.04:p<=20?.014:.005;
  const near=gq.filter(q=>+q.position>=7.5&&+q.position<=20.5&&+q.impressions>=30)
    .map(q=>({...q,gain:Math.round(+q.impressions*ctrAt(4)- +q.clicks)}))
    .filter(q=>q.gain>0).sort((a,b)=>b.gain-a.gain).slice(0,5);
  const nearGain=near.reduce((s,q)=>s+q.gain,0);
  // tieu de hong: xep hang tot nhung it ai bam
  const weakTitle=gq.filter(q=>+q.position<=10&&+q.impressions>=150&&+q.ctr<ctrAt(+q.position)*0.4)
    .sort((a,b)=>b.impressions-a.impressions).slice(0,6);

  // ----- TRANG: ghep Search Console (nguon) voi GA4 (nguoi doc that su lam gi) -----
  const path=u=>{try{return new URL(u).pathname}catch(e){return (u||"").replace(/^https?:\/\/[^/]+/,"")||"/"}};
  const lpAgg={}; (lp||[]).filter(r=>+r.cua_so===n).forEach(r=>{
    lpAgg[r.landing_page||"/"]={s:+r.phien||0, e:+r.gan_ket||0, t:+r.giay_tong||0}});
  const pageRows=gp.slice(0,10).map(p=>{const g=lpAgg[path(p.page)]||null;
    return {...p, ses:g?g.s:null, er:g&&g.s?g.e/g.s:null, sec:g&&g.s?g.t/g.s:null}});

  // ----- Meta -----
  const M=mt||[];
  const msp=sum(M,"spend",start,end),  pmsp=sum(M,"spend",pStart,pEnd);
  const mcl=sum(M,"clicks",start,end), pmcl=sum(M,"clicks",pStart,pEnd);
  const mim=sum(M,"impressions",start,end), pmim=sum(M,"impressions",pStart,pEnd);
  const cpc=mcl?msp/mcl:null,  pcpc=pmcl?pmsp/pmcl:null;
  const cpm=mim?msp/mim*1000:null, pcpm=pmim?pmsp/pmim*1000:null;
  const acc={}; M.filter(r=>inR(r.day,start,end)).forEach(r=>{const k=r.account_name||"(không tên)";

  // ----- THE: VIEC CUA TUAN NAY (danh sach hanh dong) -----

  // ----- THE: COHORT THEO TUAN VAO -----

   +kpi("Chênh",(tuanNay?((tuanNay.dh-ctTuanCua(tuanNay.tuan)>=0?"+":"")+dec(tuanNay.dh-ctTuanCua(tuanNay.tuan),1)):"—"),"","thực tế trừ chỉ tiêu tuần")
   +kpi("Đang kẹt giữa phễu",fmt(ketTot),"","đã vào phễu nhưng chưa ra kết quả")+"</div>"

   +"</tbody></table></div>"
   +(ktRows.length ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Đang kẹt — và không ai ghi vì sao</p>'
     +'<div class="tw"><table><thead><tr><th>Đang ở bước</th><th>Số lead</th><th>Im lặng TB (ngày)</th><th>Chưa ghi lý do</th></tr></thead><tbody>'
     +ktRows.map(([k,v])=>"<tr><td>"+k+'</td><td class="mono">'+fmt(v.n)+'</td><td class="mono">'+Math.round(v.ngay/v.n)
       +'</td><td class="mono">'+fmt(v.chua)+" / "+fmt(v.n)+"</td></tr>").join("")+"</tbody></table></div>" : "")
   +(lyLoc.length ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Im lặng lâu nhất — 10 trường hợp cần một câu trả lời</p>'
     +'<div class="tw"><table><thead><tr><th>Phụ huynh / bé</th><th>Campus</th><th>Đang ở bước</th><th>Im lặng</th></tr></thead><tbody>'
     +lyLoc.slice(0,10).map(r=>"<tr><td>"+(r.ten||"(không tên)")+"</td><td>"+r.campus+"</td><td>"+r.giai_doan
       +'</td><td class="mono">'+fmt(r.so_ngay_im_lang)+" ngày</td></tr>").join("")+"</tbody></table></div>" : "")
   +'<p class="leg"><b>Cách đọc:</b> “Đi học” = lead đã chuyển sang <i>Kết thúc thành công</i> trong tuần đó. '
   +'CRM chỉ lưu <b>trạng thái hiện tại</b>, không lưu lịch sử chuyển bước — nên tuần được tính theo <i>ngày cập nhật gần nhất</i>. '
   +'Một lead được sửa lại vì lý do khác sẽ nhảy sang tuần mới. Số này đủ để thấy xu hướng, chưa đủ để chấm KPI cá nhân.</p>'
   +'<div class="q"><b>Câu hỏi cho từng campus:</b> trong 10 dòng trên, ai đã gọi lại lần cuối, ngày nào, và phụ huynh nói gì? '
   +'Nếu không ai trả lời được thì <b>đó mới là con số cần sửa</b>, không phải tỷ lệ chốt.</div></div>';

  const hsCard = !H.length ? "" :
   '<div class="card"><h2>Học sinh và tuyển sinh</h2><p class="sub">Từ AMIS CRM · '+nhanCP+' · cập nhật ở lần bấm “Kéo AMIS” gần nhất</p>'
   +'<div class="kpis">'
   +kpi("Đang đi học",fmt(diHoc),"","có lớp cụ thể, đang phát sinh doanh thu")
   +kpi("Đóng tiền, chờ đi học",fmt(choHoc),"","lớp ghi “Chờ nhập học”")
   +kpi("Bảo lưu",fmt(baoLuu),"","tạm nghỉ, còn giữ chỗ")
   +kpi("Lead mới trong kỳ",fmt(tsTong),"","tính theo ngày tạo tuyển sinh")+"</div>"
   +(campRows.length ? '<div class="tw" style="margin-top:14px"><table><thead><tr><th>Campus</th><th>Đang đi học</th><th>Số lớp</th><th>HS/lớp</th></tr></thead><tbody>'
     +campRows.map(([k,v])=>"<tr><td>"+k+'</td><td class="mono">'+fmt(v.hs)+'</td><td class="mono">'+fmt(v.lop)+'</td><td class="mono">'+(v.lop?(v.hs/v.lop).toFixed(1):"--")+"</td></tr>").join("")
     +'<tr><td><b>Toàn hệ thống</b></td><td class="mono"><b>'+fmt(diHoc)+'</b></td><td class="mono"><b>'+fmt(tongLop)+'</b></td><td class="mono"><b>'+(tongLop?(diHoc/tongLop).toFixed(1):"--")+"</b></td></tr>"
     +"</tbody></table></div>" : "")
   +(giuRows.length>1 && !CP ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Lead mới trong kỳ, theo nơi giữ</p>'
     +'<div class="tw"><table><thead><tr><th>Nơi giữ</th><th>Lead</th><th>Tham quan</th><th>Chốt</th><th>Tỷ lệ chốt</th></tr></thead><tbody>'
     +giuRows.map(([k,v])=>"<tr><td>"+k+'</td><td class="mono">'+fmt(v.lead)+'</td><td class="mono">'+fmt(v.tq)
       +'</td><td class="mono">'+fmt(v.chot)+'</td><td class="mono">'+(v.lead?pct(v.chot/v.lead,1):"—")+"</td></tr>").join("")
     +"</tbody></table></div>"
     +'<p class="leg">“Nơi giữ” lấy từ trường <b>Chủ sở hữu</b> trong AMIS. Lead do Hiền nhận rồi chuyển về campus mà không đổi chủ sở hữu thì vẫn nằm ở dòng trên — nên bảng này đo <b>ai đứng tên</b>, chưa chắc đã là <b>ai gọi</b>.</p>' : "")
   +(gdRows.length ? '<p class="sub" style="margin:16px 0 6px;text-transform:none;letter-spacing:0">Lead mới trong kỳ, theo giai đoạn</p>'
     +'<div class="tw"><table><thead><tr><th>Giai đoạn</th><th>Số lead</th></tr></thead><tbody>'
     +gdRows.map(([k,v])=>"<tr><td>"+k+'</td><td class="mono">'+fmt(v)+"</td></tr>").join("")+"</tbody></table></div>" : "")
   +'<p class="leg"><b>Cách phân loại:</b> trường “Lớp” trong AMIS chứa cả lớp thật lẫn trạng thái. '
   +'Thứ tự ưu tiên: đã rời (Nghỉ học/Tốt nghiệp/Hoàn cọc) → Bảo lưu → Chờ nhập học → Ngắn ngày → lớp thật (TTLN/Ghi nhận/GTTC). '
   +'Một học sinh có thể mang nhiều giá trị cùng lúc, nên thứ tự này quyết định họ được đếm vào đâu.</p>'
   +(chuaPL ? '<div class="gap"><b>'+fmt(chuaPL)+' học sinh chưa phân loại được</b> — bản ghi không có giá trị ở trường Lớp.<br>'
     +'Ai điền trường này khi nhận học sinh mới?</div>' : "")
   +'<div class="gap"><b>Chưa đủ toàn hệ thống.</b> Con số trên chỉ gồm các campus dùng AMIS CRM. '
   +'Tân Thuận (~65 học sinh, 14 giáo viên) không dùng CRM do cấu trúc pháp lý riêng; Linh Đàm cũng không — đang xác minh. '
   +'Nguồn khác: file nhân sự ghi 768 học sinh / 61 lớp / 161 giáo viên; Tomia (01/06) ghi 777 đi học ở 15 trường.</div>'
   +'<div class="q"><b>Câu hỏi:</b> con số “đang đi học” này có khớp với sổ điểm danh sáng nay ở từng campus không — lệch ở đâu?</div></div>';

  $("body").innerHTML=
   viecCard
   +ctCard
   +cohCard
   +dsCard
   +hsCard
   +ddCard
   +moGap
   +'<div class="card"><h2>Website</h2><p class="sub">'+start+" → "+end+" · "+n+' ngày</p>'
   +'<div class="kpis">'
   +kpi("Lượt vào web",fmt(ses),delta(ses,pses),"mỗi lần một người mở website")
   +kpi("Số người",fmt(usr),delta(usr,pusr),"người khác nhau, không tính lặp")
   +kpi("Bấm từ Google",fmt(cl),delta(cl,pcl),"bấm vào web từ kết quả tìm kiếm")
   +kpi("Hiện trên Google",fmt(im),delta(im,pim),"số lần web xuất hiện, chưa ai bấm")+"</div>"
   +'<div style="margin-top:14px">'+spark(series)+"</div></div>"

   +evCard

   +wCard

   +metaCard

   +cmpCard

   +'<div class="card"><h2>Nguồn truy cập</h2><p class="sub">Phiên theo kênh · '+fmt(chTot)+" phiên</p>"
   +chRows.map(([k,v])=>'<div class="frow"><div class="fm"><span>'+k+'</span><span><b class="mono">'+fmt(v)
     +'</b> <span style="color:var(--muted)">'+pct(v/chTot,1)+"</span></span></div>"
     +'<div class="bar"><i style="width:'+(v/chRows[0][1]*100).toFixed(1)+'%"></i></div></div>').join("")
   +'<p class="leg"><b>Organic Search</b> = tự tìm thấy trên Google · <b>Direct</b> = gõ thẳng địa chỉ hoặc bookmark · '
   +'<b>Paid Social</b> = từ quảng cáo Facebook · <b>Referral</b> = trang khác dẫn sang.</p>'
   +'<p class="note">Paid Search và Paid Social gần như bằng 0 — quảng cáo hầu như không đưa ai về website.</p></div>'

   +'<div class="card"><h2>Từ khoá dẫn traffic</h2><p class="sub">5 từ khoá mang về nhiều lượt hiển thị nhất</p>'
   +'<div class="tw"><table><thead><tr><th>Từ khoá</th><th>Hiển thị</th><th>Nhấp</th><th>CTR</th><th>Vị trí</th></tr></thead><tbody>'
   +gq.slice(0,5).map(q=>"<tr><td>"+q.query+'</td><td class="mono">'+fmt(q.impressions)+'</td><td class="mono">'+fmt(q.clicks)
     +'</td><td class="mono">'+pct(q.ctr,2)+'</td><td class="mono">'+dec(q.position,1)+"</td></tr>").join("")
   +"</tbody></table></div>"
   +'<p class="leg"><b>Hiện</b> = số lần web xuất hiện trên Google · <b>Bấm</b> = số lần có người bấm vào · '
   +'<b>CTR</b> = bấm ÷ hiện · <b>Vị trí</b> = thứ hạng trung bình, 1 là cao nhất (có số lẻ vì là trung bình).</p>'
   +'<div class="q"><b>Câu hỏi:</b> từ khoá thương hiệu chỉ chiếm '+pct(allCl?brandCl/allCl:0,1)
   +' lượt nhấp trên toàn bộ '+fmt(gq.length)+' từ khoá. Người tìm thơ và truyện cho con — họ có phải phụ huynh đang chọn trường không?</div></div>'

   +nearCard

   +pageCard

   +'<div class="card"><h2>Nguồn dữ liệu</h2><p class="sub">Số nào không có thì để trống, không bịa</p>'
   +'<div class="tw"><table><thead><tr><th>Nguồn</th><th>Đến ngày</th><th>Số ngày trễ</th></tr></thead><tbody>'
   +[["GA4",days[days.length-1]],["Search Console",gs.length?gs[gs.length-1].day:null],
     ["Sự kiện + trang đích GA4",end],
     ["Meta Ads",mDays.length?mDays[mDays.length-1]:null],
     ["Điểm danh Tomia",ddNay?ddNay.ngay:null],
     ["Học sinh AMIS CRM",H.length?"lần bấm “Kéo AMIS” gần nhất":null],
     ["Lượt giơ tay trên web",(W.length?String(W[0].ts).slice(0,10):null)]]
     .map(([nm,d])=>{const lag=(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))?Math.round((Date.now()-new Date(d))/864e5):null;
       return "<tr><td>"+nm+'</td><td class="mono">'+(d||"—")+'</td><td class="mono">'+(lag==null?"—":lag)+"</td></tr>"}).join("")
   +"</tbody></table></div>"
   +'<p class="note">Chưa nối: Harasocial (hộp thư Messenger/Zalo) · SUPA checklist · giáo viên · tài chính.</p></div>'
   +dongGap;
}

sb.auth.onAuthStateChange(async(_e,session)=>{
  if(session){
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    $("who").textContent=session.user.email;
    render();
  }
});
(async()=>{const {data:{session}}=await sb.auth.getSession();
 if(session){$("login").classList.add("hidden");$("app").classList.remove("hidden");
 $("who").textContent=session.user.email;render();}})();
</script></body></html>
