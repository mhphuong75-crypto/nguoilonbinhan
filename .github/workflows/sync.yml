name: Keo du lieu Google + Meta -> Supabase

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [kho-co-file-moi]

concurrency:
  group: keo-du-lieu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-auth requests openpyxl

      - name: Boc file Tomia trong kho
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/tomia.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Boc checklist SUPA trong kho
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/supa.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Lam moi kho (mv_*)
        if: always()
        timeout-minutes: 12
        run: |
          curl -sS -X POST "${SUPABASE_URL}/rest/v1/rpc/lam_moi_kho" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --max-time 660 -d '{}' || echo "lam_moi_kho: timeout/err (pg_cron van chay du phong)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Keo GA4 + Meta
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/sync.py 90
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          META_TOKEN: ${{ secrets.NGUOILONBINHAN_META_TOKEN }}
