name: Soi cau truc file trong kho
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Thu muc trong kho (tomia/ hoac supa/)"
        default: "supa/"
      so_dong:
        description: "So dong dau moi sheet"
        default: "16"
jobs:
  soi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openpyxl
      - run: python scripts/soi_file.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CHI_PREFIX: ${{ inputs.prefix }}
          SO_DONG: ${{ inputs.so_dong }}
